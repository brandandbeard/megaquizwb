<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mind Maps — Mega Quiz</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0f19;--sf:#151a25;--sf2:#1e2636;--ac:#f5b301;--tx:#e2e8f0;--tx2:#94a3b8;--bd:#2d3748;--ok:#10b981;--err:#ef4444;--warn:#f59e0b}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
/* topbar */
#topbar{height:54px;flex-shrink:0;display:flex;align-items:center;gap:.6rem;padding:0 .8rem;background:rgba(11,15,25,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);z-index:100;overflow-x:auto;scrollbar-width:none}
#topbar::-webkit-scrollbar{display:none}
.logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:inherit;font-family:'Space Grotesk';font-weight:700;flex-shrink:0}
.logo img{width:26px;height:26px;border-radius:7px}
.logo b span{color:var(--ac)}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .7rem;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);font:500 .8rem Inter;cursor:pointer;white-space:nowrap;transition:.15s;flex-shrink:0}
.btn:hover{color:#fff;border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#111;font-weight:700}
.btn.on{background:rgba(245,179,1,.15);border-color:var(--ac);color:var(--ac)}
.btn.ic{width:32px;height:32px;padding:0;justify-content:center}
.sep{width:1px;height:20px;background:var(--bd);flex-shrink:0}
.dot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.dot.on{border-color:#fff}
.dot.reset{background:transparent;border:1.5px dashed var(--tx2);position:relative}
/* main */
#main{flex:1;position:relative;overflow:hidden}
/* landing */
#landing{position:absolute;inset:0;overflow-y:auto;padding:1.2rem 1.2rem 2rem}
.crumb{display:flex;gap:.4rem;flex-wrap:wrap;font-size:.85rem;color:var(--tx2);margin-bottom:1.2rem}
.crumb span{cursor:pointer}.crumb span:hover{color:var(--ac)}.crumb .cur{color:#fff;font-weight:600;cursor:default}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));max-width:1200px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:1.2rem;cursor:pointer;transition:.25s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 10px 30px rgba(245,179,1,.12)}
.card h3{font-size:1.1rem;margin-bottom:.3rem}
.card p{font-size:.8rem;color:var(--tx2)}
.card .tag{position:absolute;top:.8rem;right:.8rem;font-size:.68rem;padding:.15rem .5rem;border-radius:99px;background:var(--sf2);color:var(--ac);border:1px solid var(--bd)}
/* editor */
#editor{position:absolute;inset:0;display:none}
body[data-view="editor"] #editor{display:block}
body[data-view="editor"] #landing{display:none}
body[data-view="editor"] footer{display:none}
#wrap{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:radial-gradient(900px 500px at 50% 40%,rgba(245,179,1,.04),transparent 60%)}
#wrap:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#linesSvg{position:absolute;left:0;top:0;width:10px;height:10px;overflow:visible}
#linesSvg path,#linesSvg line{fill:none;stroke-linecap:round}
.node{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;display:flex;align-items:stretch;color:#eef1f6;font-size:13px;line-height:1.4;cursor:pointer;user-select:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.node:hover{border-color:rgba(255,255,255,.35);z-index:5}
.node.sel{outline:2px solid var(--warn);outline-offset:2px;z-index:6}
.node.root{background:linear-gradient(135deg,#ffd34d,#f5b301);border:none;color:#141000;font-weight:700}
.node .handle{display:flex;align-items:center;padding:0 5px;color:rgba(255,255,255,.35);cursor:grab;font-size:.8rem;border-right:1px solid rgba(255,255,255,.1)}
.node.root .handle{color:rgba(0,0,0,.45);border-right-color:rgba(0,0,0,.15)}
.node .handle:active{cursor:grabbing}
.node .txt{padding:7px 10px;flex:1;text-align:left;word-break:break-word}
.node .txt[contenteditable="true"]{outline:1.5px solid var(--ac);cursor:text;user-select:text;border-radius:4px}
.cbadge{position:absolute;right:-10px;top:50%;transform:translateY(-50%);min-width:20px;height:20px;border-radius:99px;background:var(--sf2);border:1.5px solid var(--ac);color:var(--ac);font:700 .68rem/17px Inter;text-align:center;cursor:pointer;z-index:7}
.cbadge:hover{background:var(--ac);color:#111}
.ghost{opacity:.85;pointer-events:none;position:fixed;z-index:999;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.dz-before{box-shadow:0 -4px 0 0 var(--ok)!important}
.dz-after{box-shadow:0 4px 0 0 var(--ok)!important}
.dz-child{outline:2.5px solid var(--warn)!important;outline-offset:1px}
/* layout bar + zoom */
#laybar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:rgba(21,26,37,.92);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:10px;padding:4px;z-index:50}
#laybar button{border:none;background:transparent;color:var(--tx2);font:600 .78rem Inter;padding:.45rem .8rem;border-radius:7px;cursor:pointer;display:flex;gap:.35rem;align-items:center}
#laybar button.on{background:var(--ac);color:#111}
#zoomc{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:2px;background:rgba(21,26,37,.92);border:1px solid var(--bd);border-radius:10px;padding:4px;z-index:50}
#zoomc button{width:32px;height:32px;border:none;border-radius:7px;background:transparent;color:var(--tx2);cursor:pointer}
#zoomc button:hover{background:var(--sf2);color:#fff}
#zi{font:600 .65rem 'Space Grotesk';color:var(--tx2);text-align:center;padding:2px}
/* modals & toast */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:500;padding:1rem}
.mbg.show{display:flex}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:1.5rem;width:100%;max-width:440px}
.modal h2{font:700 1.1rem 'Space Grotesk';margin-bottom:1rem;display:flex;gap:.5rem;align-items:center}
.modal h2 i{color:var(--ac)}
.in{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:.7rem .9rem;color:#fff;font:400 .9rem Inter;outline:none}
.in:focus{border-color:var(--ac)}
textarea.in{min-height:110px;resize:vertical}
.mact{display:flex;gap:.6rem;margin-top:1.1rem}
.mact .btn{flex:1;justify-content:center;padding:.7rem}
#toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(21,26,37,.96);border:1px solid var(--bd);border-radius:10px;padding:.7rem 1.2rem;font:500 .85rem Inter;display:flex;gap:.5rem;align-items:center;z-index:600;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.ok{border-color:var(--ok);color:#7ee2a8}#toast.err{border-color:var(--err);color:#ff9a9e}
/* footer: compact one-liner */
footer{flex-shrink:0;border-top:1px solid var(--bd);background:var(--sf);padding:.45rem .9rem .35rem;font-size:.72rem;color:var(--tx2)}
.f-row{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;justify-content:center}
.f-row img{width:18px;height:18px;border-radius:5px;vertical-align:-4px}
.f-row b{color:#b4b4be;font-size:.75rem}
.f-row a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.f-row a svg{width:13px;height:13px}
.f-row a:hover{color:#fff}
.f-bottom{text-align:center;border-top:1px solid var(--bd);margin-top:.35rem;padding-top:.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:760px){.btn span{display:none}.f-row{gap:.5rem;font-size:.66rem}}
</style>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  SCRIPT_URL: '',            // ← তোমার Apps Script /exec URL এখানে বসাও
  PASSWORD: 'mindmap0',
  LS: 'mq_mindmap_v5'
};
const PALETTE = ['#f5b301','#4f69e8','#f29f7c','#4caa70','#2566df','#ff6384','#4bc0c0','#9966ff'];

/* ================= STATE ================= */
const S = {
  view:'landing', nav:[], curriculum:[], topic:null, map:null, selId:null,
  layout:'timeline', zoom:1, px:0, py:0,
  history:[], hi:-1, unlocked:false, pending:null
};
let segs=[], boxes=[];
const $=id=>document.getElementById(id);
const uid=()=>'n'+Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const clone=o=>JSON.parse(JSON.stringify(o));
const vis=n=>(n.children||[]).filter(c=>!n.collapsed);
function toast(m,t){const e=$('toast');$('tmsg').textContent=m;e.className='show '+(t||'');setTimeout(()=>e.className='',2800)}
function openM(id){$(id).classList.add('show')} function closeM(id){$(id).classList.remove('show')}

/* ================= TEXT MEASURE ================= */
const mctx=document.createElement('canvas').getContext('2d');
function measure(text,fs,maxW){
  mctx.font=fs+'px Inter, sans-serif';
  const words=String(text).split(/\s+/); const lines=[]; let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;
    if(mctx.measureText(t).width>maxW-22&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);
  const w=Math.min(maxW,Math.max(46,...lines.map(l=>mctx.measureText(l).width))+22);
  return{lines,w,h:lines.length*(fs*1.35)+14};
}
const fsOf=(n,d)=>(n.style&&n.style.fontSize)||[17,14,13,12][Math.min(d,3)];
const colorOf=n=>(n.style&&n.style.color)||null;
function lum(hex){const n=parseInt(hex.slice(1),16);return(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255}

/* ================= DEFAULT DEMO (from your SVG) ================= */
function demoData(){

      B('1498: Vasco da Gama reaches Calicut with help of Abdul Majid, opening the European sea route to India',[]),
      B('1505: Francisco de Almeida becomes first Portuguese Governor in India at Cochin',[]),
      B('1510: Afonso de Albuquerque captures Goa, making it the Portuguese capital in Asia',[
        B('Real founder of Portuguese power in the East',[]),B('First Indian territory under Europeans',[]),B('Abolition of sati',[])]),
      B('1526: Babur defeats Ibrahim Lodi at First Panipat and founds the Mughal Empire',[]),
      B('1545: Sher Shah dies after land revenue reforms and the Grand Trunk Road',[])]),
    B('1551–1600: Akbar\'s Empire & English Entry',[
      B('1556: Akbar crowned at Kalanaur; Second Panipat defeats Hemu',[]),
      B('1576: Battle of Haldighati — Rana Pratap fights Man Singh\'s army',[]),
      B('1582: Akbar introduces Din-i-Ilahi, a syncretic faith',[]),
      B('1600: Queen Elizabeth I grants royal charter to the English East India Company',[])]),
    B('1601–1650: Jahangir, Shah Jahan & English Foothold',[
      B('1608: Captain William Hawkins seeks trade privileges at Jahangir\'s Agra court',[]),
      B('1613: Jahangir grants permanent factory at Surat under Thomas Aldworth',[]),
      B('1632: Shah Jahan begins construction of the Taj Mahal at Agra',[]),
      B('1639: Francis Day secures land to build Fort St George, Madras',[])]),
    B('1651–1700: Aurangzeb, Marathas & Company Expansion',[
      B('1658: Aurangzeb imprisons Shah Jahan and defeats Dara Shikoh',[]),
      B('1664: Shivaji sacks Surat; Colbert founds French East India Company',[]),
      B('1674: Shivaji crowned at Raigad; Pondicherry founded',[]),
      B('1690: Job Charnock establishes English settlement at Sutanuti, Calcutta',[])]),
    B('1701–1750: Mughal Decline & Regional Powers',[
      B('1707: Aurangzeb dies; Bahadur Shah I takes the throne',[]),
      B('1717: Farrukhsiyar\'s farman grants duty-free trade rights in Bengal',[]),
      B('1739: Nadir Shah sacks Delhi and carries away the Peacock Throne',[]),
      B('1746: French capture Madras (First Carnatic War)',[])]),
    B('1751–1800: Battles, Company Rule & Governor-Generals',[
      B('1757: Battle of Plassey — Clive defeats Siraj-ud-Daulah',[]),
      B('1764: Battle of Buxar; 1765 Diwani of Bengal to Company',[]),
      B('1773: Regulating Act — Warren Hastings first Governor-General',[]),
      B('1799: Tipu Sultan dies at Seringapatam (Fourth Anglo-Mysore War)',[])]),
    B('1801–1850: Expansion, Reform & Resistance',[
      B('1813: Charter Act ends Company monopoly on trade with India',[]),
      B('1829: Bentinck bans sati through Bengal Regulation XVII',[]),
      B('1835: Macaulay\'s Minute recommends English education',[]),
      B('1849: Punjab annexed after Second Anglo-Sikh War',[])]),
    B('1851–1900: Revolt, Crown Rule & Congress',[
      B('1857: Great Revolt begins at Meerut; Zafar proclaimed leader',[]),
      B('1858: Crown takes over; Canning first Viceroy',[]),
      B('1885: Indian National Congress founded in Bombay',[])]),
    B('1901–1950: Freedom Movement to Republic',[
      B('1905: Partition of Bengal triggers Swadeshi & boycott movement',[]),
      B('1919: Rowlatt Act; Jallianwala Bagh massacre (13 April)',[]),
      B('1930: Dandi March launches Civil Disobedience',[]),
      B('1942: Quit India Movement launched (8 August)',[]),
      B('1947: Independence; India & Pakistan created',[]),
      B('1950: Constitution in force — India becomes a republic',[])])
  ]};
}
function demoCurriculum(){
  const m=demoData();
  return [{id:uid(),name:'Class 10',type:'class',children:[
    {id:uid(),name:'History',type:'subject',children:[
      {id:uid(),name:'Modern Indian History',type:'topic',data:m}]}]}];
}

/* ================= LIVE LOAD / BACKUP (Google Sheet) ================= */
async function loadFromSheet(){
  if(!CONFIG.SCRIPT_URL)return false;
  try{
    const r=await fetch(CONFIG.SCRIPT_URL+'?action=getAll');
    const j=await r.json();
    if(!j.success||!j.data||!j.data.classes||!j.data.classes.length)return false;
    const db=j.data, tree=[];
    const getC=n=>{let c=tree.find(x=>x.name===n);if(!c){c={id:uid(),name:n,type:'class',children:[]};tree.push(c)}return c};
    const getS=(c,n)=>{let s=c.children.find(x=>x.name===n);if(!s){s={id:uid(),name:n,type:'subject',children:[]};c.children.push(s)}return s};
    const getT=(s,n)=>{let t=s.children.find(x=>x.name===n);if(!t){t={id:uid(),name:n,type:'topic',data:null};s.children.push(t)}return t};
    db.classes.forEach(c=>getC(c));
    db.subjects.forEach(s=>getS(getC(s.cls),s.subject));
    db.topics.forEach(t=>getT(getS(getC(t.cls),t.subject),t.topic));
    db.maps.forEach(m=>{try{getT(getS(getC(m.cls),m.subject),m.topic).data=JSON.parse(m.json)}catch(e){}});
    S.curriculum=tree; return true;
  }catch(e){return false}
}
function collectBackup(){
  const classes=[],subjects=[],topics=[],maps=[];
  S.curriculum.forEach(c=>{classes.push(c.name);
    (c.children||[]).forEach(s=>{subjects.push({cls:c.name,subject:s.name});
      (s.children||[]).forEach(t=>{topics.push({cls:c.name,subject:s.name,topic:t.name});
        if(t.data)maps.push({cls:c.name,subject:s.name,topic:t.name,json:JSON.stringify(t.data)});});});});
  return{classes,subjects,topics,maps};
}
async function backupAll(){

/* ================= NODE OPS ================= */
function findN(id,n=S.map){if(n.id===id)return n;for(const c of n.children||[]){const f=findN(id,c);if(f)return f}return null}
function findP(id,n=S.map){for(const c of n.children||[]){if(c.id===id)return n;const f=findP(id,c);if(f)return f}return null}
function isDesc(anc,id){for(const c of anc.children||[]){if(c.id===id||isDesc(c,id))return true}return false}
function countD(n){let c=(n.children||[]).length;(n.children||[]).forEach(k=>c+=countD(k));return c}
function addChild(){const p=S.selId?findN(S.selId):S.map;if(!p)return;p.children=p.children||[];
  const n={id:uid(),text:'New node',children:[]};p.children.push(n);p.collapsed=false;S.selId=n.id;mutate();editSoon(n.id)}
function addSibling(){if(!S.selId||S.selId===S.map.id)return addChild();const p=findP(S.selId);if(!p)return;
  const n={id:uid(),text:'New node',children:[]};p.children.splice(p.children.findIndex(c=>c.id===S.selId)+1,0,n);S.selId=n.id;mutate();editSoon(n.id)}
function delSelected(){if(!S.selId||S.selId===S.map.id)return toast('Root delete করা যাবে না','err');
  const p=findP(S.selId);if(!p)return;p.children=p.children.filter(c=>c.id!==S.selId);S.selId=p.id;mutate();toast('🗑 Deleted (Undo available)','ok')}
function fmt(f){const n=S.selId?findN(S.selId):null;if(!n)return;n.style=n.style||{};n.style[f]=!n.style[f];mutate();syncStyleBtns()}
function fsDelta(d){const n=S.selId?findN(S.selId):null;if(!n)return;n.style=n.style||{};
  n.style.fontSize=Math.max(9,Math.min(30,(n.style.fontSize||fsOf(n,n._d||0))+d));mutate()}
function setColor(c){const n=S.selId?findN(S.selId):null;if(!n)return;n.style=n.style||{};
  if(c)n.style.color=c;else delete n.style.color;mutate()}
function syncStyleBtns(){const n=S.selId?findN(S.selId):null;const st=n&&n.style||{};
  const b=$('bB'),i=$('bI'),u=$('bU');if(b)b.classList.toggle('on',!!st.bold);if(i)i.classList.toggle('on',!!st.italic);if(u)u.classList.toggle('on',!!st.underline);
  document.querySelectorAll('#topbar .dot').forEach(d=>d.classList.remove('on'));}
function collapseAll(v){(function w(n){if(n.children&&n.children.length)n.collapsed=v;(n.children||[]).forEach(w)})(S.map);S.map.collapsed=false;mutate()}
function editSoon(id){setTimeout(()=>{const el=document.querySelector(`.node[data-id="${id}"] .txt`);if(el)startEdit(el,findN(id))},60)}
function startEdit(el,n){el.contentEditable='true';el.focus();document.execCommand('selectAll',false,null);
  const done=()=>{el.contentEditable='false';const t=el.innerText.replace(/\s+/g,' ').trim();if(t&&t!==n.text){n.text=t;mutate()}else renderMap();
    el.removeEventListener('blur',done)};
  el.addEventListener('blur',done);
  el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}if(e.key==='Escape'){el.innerText=n.text;el.blur()}}}

/* ================= LAYOUTS ================= */
function setBox(n,d,x,y,m){n._d=d;n._x=x;n._y=y;n._w=m.w;n._h=m.h;n._lines=m.lines;boxes.push(n)}
function layoutTimeline(){
  segs=[];boxes=[];
  const R=S.map,rm=measure(R.text,fsOf(R,0),430);setBox(R,0,0,0,rm);
  let cx=R._w/2+90;
  vis(R).forEach((b,i)=>{
    const bm=measure(b.text,fsOf(b,1),320);
    const bx=cx+bm.w/2;setBox(b,1,bx,0,bm);
    const col=colorOf(b)||'rgba(255,255,255,.35)';
    const dir=i%2===0?1:-1, spineX=bx;
    let y=dir*(bm.h/2+46), colRight=bx+bm.w/2, lastY=y;
    vis(b).forEach(leaf=>{
      const lm=measure(leaf.text,fsOf(leaf,2),340);
      const lx=spineX+90+lm.w/2;setBox(leaf,2,lx,y+dir*lm.h/2,lm);
      segs.push({x1:spineX,y1:leaf._y,x2:lx-lm.w/2,y2:leaf._y,c:col,w:1.5});
      y+=dir*(lm.h+22);lastY=leaf._y;colRight=Math.max(colRight,lx+lm.w/2);
      const kids=vis(leaf);
      if(kids.length){
        const msx=spineX+136;let ky=y;
        kids.forEach(ch=>{const cm=measure(ch.text,fsOf(ch,3),300);
          const chx=msx+60+cm.w/2;setBox(ch,3,chx,ky+dir*cm.h/2,cm);
          segs.push({x1:msx,y1:ch._y,x2:chx-cm.w/2,y2:ch._y,c:col,w:1.2});
          ky+=dir*(cm.h+18);colRight=Math.max(colRight,chx+cm.w/2)});
        segs.push({x1:msx,y1:leaf._y+dir*leaf._h/2,x2:msx,y2:kids[kids.length-1]._y,c:col,w:1.5});
        y=ky;lastY=kids[kids.length-1]._y;
      }
    });
    if(vis(b).length)segs.push({x1:spineX,y1:dir*(bm.h/2+8),x2:spineX,y2:lastY,c:col,w:2});
    cx=colRight+100;
  });
  const br=vis(R);
  if(br.length)segs.unshift({x1:R._w/2+6,y1:0,x2:br[br.length-1]._x,y2:0,c:'rgba(255,255,255,.4)',w:3});
}
function layoutTree(){
  segs=[];boxes=[];let slot=0;
  (function w(n,d){
    const m=measure(n.text,fsOf(n,d),d===0?430:320);
    const kids=vis(n);
    kids.forEach(k=>w(k,d+1));
    if(!kids.length)n._slot=slot++;else n._slot=(kids[0]._slot+kids[kids.length-1]._slot)/2;
    setBox(n,d,d*300,n._slot*84,m);
    kids.forEach(k=>segs.push({d:`M ${n._x+n._w/2} ${n._y} C ${n._x+n._w/2+70} ${n._y}, ${k._x-k._w/2-70} ${k._y}, ${k._x-k._w/2} ${k._y}`,c:colorOf(k)||'rgba(255,255,255,.3)',w:1.5}));
  })(S.map,0);
}
function layoutRadial(){
  layoutTree();
  const maxY=Math.max(...boxes.map(b=>b._y),1);
  boxes.forEach(n=>{if(n._d===0){n._x=0;n._y=0}else{const r=n._x,a=(n._y/maxY)*Math.PI*2-Math.PI/2;n._x=Math.cos(a)*r;n._y=Math.sin(a)*r}});
  segs=[];(function w(n){vis(n).forEach(k=>{segs.push({x1:n._x,y1:n._y,x2:k._x,y2:k._y,c:colorOf(k)||'rgba(255,255,255,.3)',w:1.5});w(k)})})(S.map);
}
function renderMap(){
  if(!S.map)return;
  if(S.layout==='timeline')layoutTimeline();else if(S.layout==='tree')layoutTree();else layoutRadial();
  const svg=$('linesSvg');
  svg.innerHTML=segs.map(s=>s.d?`<path d="${s.d}" stroke="${s.c}" stroke-width="${s.w}"/>`:`<line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" stroke="${s.c}" stroke-width="${s.w}"/>`).join('');
  const wrap=$('nodes');wrap.innerHTML='';
  boxes.forEach(n=>{
    const el=document.createElement('div');
    el.className='node'+(n._d===0?' root':'')+(S.selId===n.id?' sel':'');
    el.dataset.id=n.id;el.style.left=n._x+'px';el.style.top=n._y+'px';el.style.width=n._w+'px';
    const st=n.style||{};
    if(n._d>0&&st.color){el.style.background=st.color;el.style.borderColor=st.color;el.style.color=lum(st.color)>0.6?'#141000':'#fff'}
    if(st.fontSize)el.style.fontSize=st.fontSize+'px';
    if(st.bold)el.style.fontWeight='700';
    if(st.italic)el.style.fontStyle='italic';
    if(st.underline)el.style.textDecoration='underline';
    el.innerHTML=(n._d===0?'':`<span class="handle">⠿</span>`)+`<span class="txt">${esc(n._lines.join('<br>'))}</span>`+
      ((n.children&&n.children.length&&n.collapsed)?`<span class="cbadge" title="Expand">+${countD(n)}</span>`:
       (n.children&&n.children.length?`<span class="cbadge" title="Collapse">${n.children.length}</span>`:''));
    const badge=el.querySelector('.cbadge');
    if(badge)badge.onclick=e=>{e.stopPropagation();need(()=>{n.collapsed=!n.collapsed;mutate()})};
    const txt=el.querySelector('.txt');
    el.onclick=e=>{if(e.target.classList.contains('cbadge'))return;S.selId=n.id;renderMap()};
    txt.ondblclick=e=>{e.stopPropagation();need(()=>startEdit(txt,n))};
    const h=el.querySelector('.handle');
    if(h)h.addEventListener('pointerdown',e=>startDrag(e,n.id));
    wrap.appendChild(el);
  });
  applyT();syncStyleBtns();
}
function applyT(){$('world').style.transform=`translate(${S.px}px,${S.py}px) scale(${S.zoom})`;$('zi').textContent=Math.round(S.zoom*100)+'%'}
function zoomBy(f){const w=$('wrap').clientWidth/2,h=$('wrap').clientHeight/2;const nz=Math.max(.15,Math.min(4,S.zoom*f));
  S.px=w-(w-S.px)*(nz/S.zoom);S.py=h-(h-S.py)*(nz/S.zoom);S.zoom=nz;applyT()}
function fit(){if(!boxes.length)return;const w=$('wrap').clientWidth,h=$('wrap').clientHeight;
  let x1=1e9,x2=-1e9,y1=1e9,y2=-1e9;boxes.forEach(b=>{x1=Math.min(x1,b._x-b._w/2);x2=Math.max(x2,b._x+b._w/2);y1=Math.min(y1,b._y-b._h/2);y2=Math.max(y2,b._y+b._h/2)});
  S.zoom=Math.max(.15,Math.min(1.6,Math.min(w/(x2-x1+160),h/(y2-y1+160))));
  S.px=w/2-(x1+x2)/2*S.zoom;S.py=h/2-(y1+y2)/2*S.zoom;applyT()}

let pan=null;
$('wrap').addEventListener('pointerdown',e=>{
  if(e.target.closest('.node'))return;
  pan={x:e.clientX-S.px,y:e.clientY-S.py};$('wrap').setPointerCapture(e.pointerId);
});
$('wrap').addEventListener('pointermove',e=>{if(!pan)return;S.px=e.clientX-pan.x;S.py=e.clientY-pan.y;applyT()});

$('wrap').addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY>0?0.9:1.1)},{passive:false});

/* ================= DRAG REARRANGE ================= */
let drag=null;
function startDrag(e,id){
  e.preventDefault();e.stopPropagation();
  need(()=>{
    const el=document.querySelector(`.node[data-id="${id}"]`);const r=el.getBoundingClientRect();
    const g=el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
    document.body.appendChild(g);
    drag={id,g,ox:e.clientX-r.left,oy:e.clientY-r.top,target:null,zone:null};
    el.style.opacity='.35';
  });
}
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  drag.g.style.left=(e.clientX-drag.ox)+'px';drag.g.style.top=(e.clientY-drag.oy)+'px';
  drag.g.style.display='none';
  const t=document.elementsFromPoint(e.clientX,e.clientY).find(el=>el.classList&&el.classList.contains('node')&&el.dataset.id!==drag.id);
  drag.g.style.display='';
  document.querySelectorAll('.dz-before,.dz-after,.dz-child').forEach(x=>x.classList.remove('dz-before','dz-after','dz-child'));
  if(t){const r=t.getBoundingClientRect();const rel=e.clientY-r.top;
    drag.target=t.dataset.id;
    drag.zone=rel<r.height*.28?'before':rel>r.height*.72?'after':'child';
    t.classList.add(drag.zone==='before'?'dz-before':drag.zone==='after'?'dz-after':'dz-child');
  }else{drag.target=null;drag.zone=null}
});
window.addEventListener('pointerup',()=>{
  if(!drag)return;
  document.querySelectorAll('.node').forEach(x=>{x.style.opacity='1';x.classList.remove('dz-before','dz-after','dz-child')});
  drag.g.remove();
  if(drag.target&&drag.zone)moveNode(drag.id,drag.target,drag.zone);
  drag=null;renderMap();
});
function moveNode(id,tid,zone){
  const n=findN(id);if(!n)return;
  const t=findN(tid);if(!t||isDesc(n,tid))return toast('নিজের child এর ভেতরে রাখা যাবে না','err');
  const op=findP(id);if(!op)return;
  op.children=op.children.filter(c=>c.id!==id);
  if(zone==='child'){t.children=t.children||[];t.children.push(n);t.collapsed=false}
  else{const tp=findP(tid);const a=tp.children;const i=a.findIndex(c=>c.id===tid);a.splice(zone==='before'?i:i+1,0,n)}
  mutate();toast('↔ Node moved','ok');
}

}

/* ================= LAYOUT SWITCH / KEYS ================= */
document.querySelectorAll('#laybar button').forEach(b=>b.onclick=()=>{
  S.layout=b.dataset.l;document.querySelectorAll('#laybar button').forEach(x=>x.classList.toggle('on',x===b));renderMap();setTimeout(fit,40)});
window.addEventListener('keydown',e=>{
  if(S.view!=='editor'||e.target.isContentEditable||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}
  else if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();redo()}
  else if(e.key==='Tab'){e.preventDefault();need(addChild)}
  else if(e.key==='Enter'){e.preventDefault();need(addSibling)}
  else if(e.key===' '){e.preventDefault();const n=S.selId&&findN(S.selId);if(n&&n.children&&n.children.length)need(()=>{n.collapsed=!n.collapsed;mutate()})}
  else if(e.key==='Delete'||e.key==='Backspace'){need(delSelected)}
  else if(e.key==='F2'){const n=S.selId&&findN(S.selId);if(n)need(()=>editSoon(n.id))}
});

/* ================= INIT ================= */
(async function init(){
  const live=await loadFromSheet();
  if(live)toast('☑ Live data loaded from Google Sheet','ok');
  else if(!loadLocal())S.curriculum=demoCurriculum();
  renderLanding();renderToolbar();
})();
</script>
