<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mind Maps — Mega Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0f19;--sf:#151a25;--sf2:#1e2636;--nd:#161b26;--ac:#f5b301;--tx:#e8ecf4;--tx2:#94a3b8;--bd:#2d3748;--ok:#10b981;--err:#ef4444}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
#topbar{height:54px;flex-shrink:0;display:flex;align-items:center;gap:.5rem;padding:0 .8rem;background:rgba(11,15,25,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);z-index:100;overflow-x:auto;scrollbar-width:none}
#topbar::-webkit-scrollbar{display:none}
.logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:inherit;font-family:'Space Grotesk';font-weight:700;flex-shrink:0}
.logo img{width:26px;height:26px;border-radius:7px}
.logo b span{color:var(--ac)}
.ttl{font:600 .9rem Inter;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .8rem;border-radius:9px;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);font:500 .82rem Inter;cursor:pointer;white-space:nowrap;transition:.15s;flex-shrink:0}
.btn:hover{color:#fff;border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#111;font-weight:700}
.btn.on{background:rgba(245,179,1,.15);border-color:var(--ac);color:var(--ac)}
.btn.ic{width:34px;height:34px;padding:0;justify-content:center}
.sep{width:1px;height:20px;background:var(--bd);flex-shrink:0}
.dot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.dot.on{border-color:#fff}
.dot.reset{background:transparent;border:1.5px dashed var(--tx2)}
#fsz{min-width:24px;text-align:center;font:600 .72rem 'Space Grotesk';color:var(--tx2)}
/* main */
#main{flex:1;position:relative;overflow:hidden}
#landing{position:absolute;inset:0;overflow-y:auto;padding:1.2rem}
.crumb{display:flex;gap:.4rem;flex-wrap:wrap;font-size:.85rem;color:var(--tx2);margin-bottom:1.2rem}
.crumb span{cursor:pointer}.crumb span:hover{color:var(--ac)}.crumb .cur{color:#fff;font-weight:600;cursor:default}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));max-width:1200px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:1.2rem;cursor:pointer;transition:.25s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--ac)}
.card h3{font-size:1.05rem;margin-bottom:.3rem}
.card p{font-size:.78rem;color:var(--tx2)}
.card .tag{position:absolute;top:.7rem;right:.7rem;font-size:.66rem;padding:.15rem .5rem;border-radius:99px;background:var(--sf2);color:var(--ac)}
.card.add{border-style:dashed;text-align:center;color:var(--tx2)}
/* editor */
#editor{position:absolute;inset:0;display:none}
body[data-view="editor"] #editor{display:block}
body[data-view="editor"] #landing{display:none}
body[data-view="editor"] footer{display:none}
#wrap{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:radial-gradient(900px 500px at 50% 40%,rgba(245,179,1,.04),transparent 60%)}
#wrap:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#linesSvg{position:absolute;left:0;top:0;width:10px;height:10px;overflow:visible}
#linesSvg line{stroke-linecap:round}
.nd{position:absolute;transform:translate(-50%,-50%);background:var(--nd);border:1px solid rgba(255,255,255,.14);border-radius:10px;display:flex;align-items:stretch;color:#eef1f6;font-size:13px;line-height:1.4;cursor:pointer;user-select:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.nd:hover{border-color:rgba(255,255,255,.4);z-index:5}
.nd.sel{outline:2px solid var(--ac);outline-offset:2px;z-index:6}
.nd.root{background:linear-gradient(135deg,#ffd34d,#f5b301);border:none;color:#141000;font-weight:700}
.nd .handle{display:none;align-items:center;padding:0 6px;color:rgba(255,255,255,.35);cursor:grab;font-size:.75rem;border-right:1px solid rgba(255,255,255,.1)}
body.unlocked .nd .handle{display:flex}
.nd.root .handle{color:rgba(0,0,0,.45);border-right-color:rgba(0,0,0,.15)}
.nd .txt{padding:7px 11px;flex:1;text-align:left;word-break:break-word}
.nd .txt[contenteditable="true"]{outline:1.5px solid var(--ac);cursor:text;user-select:text;border-radius:4px}
.cbadge{position:absolute;right:-10px;top:50%;transform:translateY(-50%);min-width:20px;height:20px;border-radius:99px;background:var(--sf2);border:1.5px solid var(--ac);color:var(--ac);font:700 .66rem/17px Inter;text-align:center;cursor:pointer;z-index:7}
.cbadge:hover{background:var(--ac);color:#111}
.ghost{opacity:.85;pointer-events:none;position:fixed;z-index:999;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.dz-before{box-shadow:0 -4px 0 0 var(--ok)!important}
.dz-after{box-shadow:0 4px 0 0 var(--ok)!important}
.dz-child{outline:2.5px solid var(--ac)!important}
/* bottom bars */
#laybar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:rgba(21,26,37,.92);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:10px;padding:4px;z-index:50}
#laybar button{border:none;background:transparent;color:var(--tx2);font:600 .78rem Inter;padding:.45rem .8rem;border-radius:7px;cursor:pointer;display:flex;gap:.35rem;align-items:center}
#laybar button.on{background:var(--ac);color:#111}
#zoomc{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:2px;background:rgba(21,26,37,.92);border:1px solid var(--bd);border-radius:10px;padding:4px;z-index:50}
#zoomc button{width:34px;height:34px;border:none;border-radius:7px;background:transparent;color:var(--tx2);cursor:pointer}
#zoomc button:hover{background:var(--sf2);color:#fff}
#zi{font:600 .65rem 'Space Grotesk';color:var(--tx2);text-align:center;padding:2px}
/* modal & toast */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:500;padding:1rem}
.mbg.show{display:flex}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:1.6rem;width:100%;max-width:420px}
.modal h2{font:700 1.1rem 'Space Grotesk';margin-bottom:1rem;display:flex;gap:.5rem;align-items:center}
.modal h2 i{color:var(--ac)}
.in{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:.8rem 1rem;color:#fff;font:400 .95rem Inter;outline:none}
.in:focus{border-color:var(--ac)}
textarea.in{min-height:110px;resize:vertical}
.mact{display:flex;gap:.6rem;margin-top:1.1rem}
.mact .btn{flex:1;justify-content:center;padding:.75rem}
#toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(21,26,37,.96);border:1px solid var(--bd);border-radius:10px;padding:.7rem 1.2rem;font:500 .85rem Inter;display:flex;gap:.5rem;align-items:center;z-index:600;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.ok{border-color:var(--ok);color:#7ee2a8}#toast.err{border-color:var(--err);color:#ff9a9e}
footer{flex-shrink:0;border-top:1px solid var(--bd);background:var(--sf);padding:.4rem .9rem .3rem;font-size:.7rem;color:var(--tx2)}
.f-row{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;justify-content:center}
.f-row img{width:16px;height:16px;border-radius:4px;vertical-align:-3px}
.f-row a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:.25rem}
.f-row a svg{width:12px;height:12px}
.f-bottom{text-align:center;border-top:1px solid var(--bd);margin-top:.3rem;padding-top:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:760px){.btn span{display:none}.ttl{max-width:26vw}}
</style>
</head>

<script>
/* ===== CONFIG ===== */
const CONFIG={SCRIPT_URL:'',PASSWORD:'mindmap0',AI_URL:'/api/mindmap-ai',LS:'mq_mm_v6'};
const PALETTE=['#4f69e8','#f29f7c','#4caa70','#2566df','#6178eb','#ff6384','#ffce54','#4bc0c0','#9966ff'];
const S={view:'landing',nav:[],curriculum:[],topic:null,map:null,selId:null,layout:'timeline',zoom:1,px:0,py:0,history:[],hi:-1,unlocked:false};
let segs=[],boxes=[];
const $=id=>document.getElementById(id);
const uid=()=>'n'+Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const vis=n=>(n.children||[]).filter(c=>!c.collapsed);
function toast(m,t){const e=$('toast');$('tmsg').textContent=m;e.className='show '+(t||'');setTimeout(()=>e.className='',2800)}
function openM(id){$(id).classList.add('show')}function closeM(id){$(id).classList.remove('show')}

/* ===== MEASURE ===== */
const mctx=document.createElement('canvas').getContext('2d');
function measure(t,fs,maxW){mctx.font=fs+'px Inter,sans-serif';
  const ws=String(t).split(/\s+/),ls=[];let cur='';
  for(const w of ws){const x=cur?cur+' '+w:w;if(mctx.measureText(x).width>maxW-22&&cur){ls.push(cur);cur=w}else cur=x}
  if(cur)ls.push(cur);
  const w=Math.min(maxW,Math.max(46,...ls.map(l=>mctx.measureText(l).width))+22);
  return{lines:ls,w,h:ls.length*(fs*1.35)+14}}
const fsOf=(n,d)=>(n.style&&n.style.fontSize)||[17,14,13,12,11][Math.min(d,4)];
const maxWOf=d=>[430,320,340,300,280][Math.min(d,4)];

/* ===== DEMO ===== */
function demoData(){const B=(t,c)=>({id:uid(),text:t,children:c||[]});
 return{id:uid(),text:'Indian Modern History (1498–1950)',style:{color:'#f5b301',bold:true},children:[
  B('1498–1550: Sea Route & Early Mughal Rise',[
    B('1498: Vasco da Gama reaches Calicut with help of Abdul Majid'),
    B('1510: Albuquerque captures Goa as Portuguese capital in Asia',[
      B('Real founder of Portuguese power in the East'),
      B('First Indian territory under Europeans'),
      B('Abolition of sati',[B('Later codified under Bengal Regulation XVII')])]),
    B('1526: Babur defeats Ibrahim Lodi at First Panipat')]),
  B('1551–1600: Akbar & English Entry',[
    B('1556: Akbar crowned; Second Panipat defeats Hemu'),
    B('1576: Battle of Haldighati — Rana Pratap vs Man Singh'),
    B('1600: East India Company royal charter')]),
  B('1651–1700: Aurangzeb & Marathas',[
    B('1674: Shivaji crowned at Raigad'),
    B('1690: Job Charnock founds Calcutta settlement')]),
  B('1901–1950: Freedom Movement',[
    B('1919: Jallianwala Bagh massacre'),
    B('1930: Dandi March & Civil Disobedience'),
    B('1947: Independence; 1950 Republic')])]};
}
function demoCurriculum(){return[{id:uid(),name:'Class 10',type:'class',children:[
  {id:uid(),name:'History',type:'subject',children:[
    {id:uid(),name:'Modern Indian History',type:'topic',data:demoData()}]}]}]}

/* ===== SHEET LIVE LOAD / BACKUP (flat rows) ===== */
async function loadLive(){
  if(!CONFIG.SCRIPT_URL)return false;
  try{
    const r=await fetch(CONFIG.SCRIPT_URL+'?action=getAll');
    const j=await r.json();
    if(!j.success||!j.rows||!j.rows.length)return false;
    return buildFromRows(j.rows);
  }catch(e){return false}
}
function buildFromRows(rows){
  const topics=new Map(),order=[];
  rows.forEach(r=>{const k=r.cls+'|'+r.sub+'|'+r.top;
    if(!topics.has(k)){topics.set(k,{cls:r.cls,sub:r.sub,top:r.top,nodes:[]});order.push(k)}
    topics.get(k).nodes.push(r)});
  const curriculum=[];const cMap=new Map(),sMap=new Map();
  order.forEach(k=>{const t=topics.get(k);
    let c=cMap.get(t.cls);if(!c){c={id:uid(),name:t.cls,type:'class',children:[]};cMap.set(t.cls,c);curriculum.push(c)}
    const sk=t.cls+'|'+t.sub;let s=sMap.get(sk);if(!s){s={id:uid(),name:t.sub,type:'subject',children:[]};sMap.set(sk,s);c.children.push(s)}
    s.children.push({id:uid(),name:t.top,type:'topic',data:treeFromNodes(t.nodes)});
  });
  S.curriculum=curriculum;return true;
}
function treeFromNodes(nodes){
  const byId=new Map();const made=[];
  nodes.forEach(r=>{const n={id:r.id||uid(),text:r.text||'Node',children:[],style:{}};
    if(r.color)n.style.color=r.color;if(r.size)n.style.fontSize=+r.size;
    if(r.bold)n.style.bold=true;if(r.und)n.style.underline=true;if(r.ita)n.style.italic=true;
    byId.set(n.id,n);made.push({r,n})});
  let root=null;
  made.forEach(({r,n})=>{if(!r.parent){if(!root)root=n}else{const p=byId.get(r.parent);if(p)p.children.push(n)}});
  if(!root){root={id:uid(),text:'Root',children:[]};made.forEach(({r,n})=>{if(!r.parent===false&&false){}}); 
    const orphans=made.filter(m=>!m.r.parent&&m.n!==root);root.children.push(...orphans.map(o=>o.n));}
  return root;
}
function flattenRows(){
  const rows=[];
  S.curriculum.forEach(c=>(c.children||[]).forEach(s=>(s.children||[]).forEach(t=>{
    if(!t.data)return;
    (function walk(n,parent){
      rows.push({cls:c.name,sub:s.name,top:t.name,id:n.id,parent:parent||'',text:n.text,
        color:n.style&&n.style.color||'',size:n.style&&n.style.fontSize||'',
        bold:n.style&&n.style.bold?'1':'',und:n.style&&n.style.underline?'1':'',ita:n.style&&n.style.italic?'1':''});
      (n.children||[]).forEach(k=>walk(k,n.id));
    })(t.data,'');
  })));
  return rows;
}
async function backupSheet(){
  if(!CONFIG.SCRIPT_URL){toast('CONFIG.SCRIPT_URL সেট করো','err');return}
  toast('☁ Sheet এ backup হচ্ছে...');
  try{
    const r=await fetch(CONFIG.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'backup',rows:flattenRows()})});
    const j=await r.json();
    if(j.success)toast('✅ Sheet এ save হয়েছে ('+j.count+' rows) — সবাই live দেখবে','ok');
    else toast('Save failed: '+j.error,'err');
  }catch(e){toast('Network error: '+e.message,'err')}
}
function saveLocal(){try{localStorage.setItem(CONFIG.LS,JSON.stringify(S.curriculum))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(CONFIG.LS);if(r){S.curriculum=JSON.parse(r);return true}}catch(e){}return false}

/* ===== LANDING ===== */
function items(){let it=S.curriculum;for(const id of S.nav){const f=it.find(x=>x.id===id);if(f)it=f.children||[]}return it}
function renderLanding(){
  const it=items();
  const names=[{n:'Home',i:-1}];let cur=S.curriculum;
  S.nav.forEach((id,k)=>{cur=cur.find(x=>x.id===id);names.push({n:cur?cur.name:'?',i:k});if(cur&&k<S.nav.length-1)cur=cur.children||[]});
  $('crumb').innerHTML=names.map((p,k)=>k===names.length-1?`<span class="cur">${p.n}</span>`:`<span onclick="S.nav=S.nav.slice(0,${p.i+1});renderLanding();renderTopbar()">${p.n}</span><span style="cursor:default">/</span>`).join('');
  $('grid').innerHTML=it.map(x=>`<div class="card" onclick="openItem('${x.id}')">
    <span class="tag">${x.type==='class'?'📚 Class':x.type==='subject'?'📖 Subject':'🧠 Topic'}</span>
    <h3>${x.name}</h3><p>${x.type==='topic'?(x.data?'Mind map ready':'Empty — click to create'):(x.children||[]).length+' items'}</p></div>`).join('')
    +`<div class="card add" onclick="addLevel()"><h3 style="color:var(--ac)">+ Add ${S.nav.length===0?'Class':S.nav.length===1?'Subject':'Topic'}</h3></div>`;
}
function addLevel(){
  const d=S.nav.length;const name=prompt(d===0?'Class name:':d===1?'Subject name:':'Topic name:');if(!name)return;
  const it=items();
  it.push(d===0?{id:uid(),name,type:'class',children:[]}:d===1?{id:uid(),name,type:'subject',children:[]}:{id:uid(),name,type:'topic',data:null});
  saveLocal();renderLanding();
}
function openItem(id){
  const x=items().find(i=>i.id===id);if(!x)return;
  if(x.type!=='topic'){S.nav.push(id);renderLanding();renderTopbar();return}
  if(!x.data)x.data={id:uid(),text:x.name,style:{color:'#f5b301',bold:true},children:[]};
  S.topic=x;S.map=x.data;S.selId=null;S.unlocked=false;document.body.classList.remove('unlocked');
  S.history=[clone(S.map)];S.hi=0;S.view='editor';document.body.dataset.view='editor';
  renderTopbar();renderMap();setTimeout(fit,60);
}
function goLanding(){S.view='landing';document.body.dataset.view='landing';S.unlocked=false;document.body.classList.remove('unlocked');renderLanding();renderTopbar()}

/* ===== TOPBAR (locked = only Edit) ===== */

/* ===== UNLOCK (Enter দিয়ে খুলবে) ===== */
function openEdit(){openM('pwModal');$('pwIn').value='';setTimeout(()=>$('pwIn').focus(),80)}
function tryUnlock(){

/* ===== LAYOUTS ===== */
function layoutTimeline(){
  segs=[];boxes=[];
  const R=S.map,rm=measure(R.text,fsOf(R,0),430);
  R._d=0;R._x=0;R._y=0;R._w=rm.w;R._h=rm.h;R._lines=rm.lines;R._col='#f5b301';boxes.push(R);
  let cx=R._w/2+90;
  vis(R).forEach((b,i)=>{
    const bm=measure(b.text,fsOf(b,1),320);
    const bx=cx+bm.w/2;
    b._d=1;b._x=bx;b._y=0;b._w=bm.w;b._h=bm.h;b._lines=bm.lines;
    b._col=(b.style&&b.style.color)||PALETTE[i%PALETTE.length];
    boxes.push(b);
    if(i>0){const prev=vis(R)[i-1];segs.push({x1:prev._x+prev._w/2+4,y1:0,x2:bx-bm.w/2-4,y2:0,c:'rgba(255,255,255,.35)',w:3})}
    else segs.push({x1:R._w/2+4,y1:0,x2:bx-bm.w/2-4,y2:0,c:'rgba(255,255,255,.35)',w:3});
    const dir=i%2===0?1:-1;
    let y=dir*(bm.h/2+46),colRight=bx+bm.w/2,last2=null;
    function place(n,d){
      const kids=vis(n);if(!kids.length)return;
      const msx=d===1?bx:(n._x-n._w/2+40);
      let lastY=null;
      kids.forEach(k=>{
        const m=measure(k.text,fsOf(k,d+1),maxWOf(d+1));
        const left=d===1?bx+90:msx+60;
        k._d=d+1;k._w=m.w;k._h=m.h;k._lines=m.lines;
        k._x=left+m.w/2;k._y=y+dir*m.h/2;
        k._col=(k.style&&k.style.color)||n._col;
        boxes.push(k);
        segs.push({x1:d===1?bx:msx,y1:k._y,x2:left,y2:k._y,c:k._col,w:1.4});
        colRight=Math.max(colRight,k._x+m.w/2);
        y+=dir*(m.h+20);lastY=k._y;
        if(d===1)last2=k._y;
        place(k,d+1);
      });
      if(d===1)segs.push({x1:bx,y1:dir*(bm.h/2+6),x2:bx,y2:last2,c:n._col,w:2});
      else segs.push({x1:msx,y1:n._y+dir*n._h/2,x2:msx,y2:lastY,c:n._col,w:1.4});
    }
    place(b,1);
    cx=colRight+100;
  });
}
function layoutTree(){
  segs=[];boxes=[];let slot=0;
  (function w(n,d){
    const m=measure(n.text,fsOf(n,d),maxWOf(d));
    const kids=vis(n);
    kids.forEach(k=>w(k,d+1));
    n._slot=kids.length?(kids[0]._slot+kids[kids.length-1]._slot)/2:slot++;
    n._d=d;n._w=m.w;n._h=m.h;n._lines=m.lines;n._x=d*300;n._y=n._slot*84;
    n._col=d===0?'#f5b301':(n.style&&n.style.color)||PALETTE[d%9];
    boxes.push(n);
    kids.forEach(k=>segs.push({x1:n._x+n._w/2,y1:n._y,x2:k._x-k._w/2,y2:k._y,c:k._col||'#888',w:1.5,curve:1,p:n,k}));
  })(S.map,0);
}
function layoutRadial(){
  layoutTree();
  const maxY=Math.max(...boxes.map(b=>b._y),1);
  boxes.forEach(n=>{if(n._d===0){n._x=0;n._y=0}else{const r=n._x,a=(n._y/maxY)*Math.PI*2-Math.PI/2;n._x=Math.cos(a)*r;n._y=Math.sin(a)*r}});
  segs=[];
  (function w(n){vis(n).forEach(k=>{segs.push({x1:n._x,y1:n._y,x2:k._x,y2:k._y,c:k._col,w:1.5});w(k)})})(S.map);
}
function renderMap(){
  if(!S.map)return;
  if(S.layout==='timeline')layoutTimeline();else if(S.layout==='tree')layoutTree();else layoutRadial();
  $('linesSvg').innerHTML=segs.map(s=>s.curve
    ?`<path d="M ${s.p._x+s.p._w/2} ${s.p._y} C ${s.p._x+s.p._w/2+60} ${s.p._y}, ${s.k._x-s.k._w/2-60} ${s.k._y}, ${s.k._x-s.k._w/2} ${s.k._y}" stroke="${s.c}" stroke-width="${s.w}" fill="none"/>`
    :`<line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" stroke="${s.c}" stroke-width="${s.w}"/>`).join('');
  const wrap=$('nodes');wrap.innerHTML='';
  boxes.forEach(n=>{
    const el=document.createElement('div');
    el.className='nd'+(n._d===0?' root':'')+(S.selId===n.id?' sel':'');
    el.dataset.id=n.id;el.style.left=n._x+'px';el.style.top=n._y+'px';el.style.width=n._w+'px';
    const st=n.style||{};
    if(n._d>0&&st.color){el.style.background=st.color;el.style.borderColor=st.color;el.style.color=lum(st.color)>.6?'#141000':'#fff'}
    if(st.fontSize)el.style.fontSize=st.fontSize+'px';
    if(st.bold)el.style.fontWeight='700';
    if(st.italic)el.style.fontStyle='italic';
    if(st.underline)el.style.textDecoration='underline';
    el.innerHTML=(n._d>0?'<span class="handle">⠿</span>':'')+`<span class="txt">${esc(n._lines.join('<br>'))}</span>`+
      ((n.children||[]).length?`<span class="cbadge" title="${n.collapsed?'Expand':'Collapse'}">${n.collapsed?'+'+(n.children.length):n.children.length}</span>`:'');
    const badge=el.querySelector('.cbadge');
    if(badge)badge.onclick=e=>{e.stopPropagation();n.collapsed=!n.collapsed;mutate()};
    const txt=el.querySelector('.txt');
    el.onclick=e=>{if(e.target.classList.contains('cbadge'))return;if(S.unlocked){S.selId=n.id;renderMap()}};
    txt.ondblclick=e=>{e.stopPropagation();if(S.unlocked)startEdit(txt,n)};
    const hd=el.querySelector('.handle');
    if(hd)hd.addEventListener('pointerdown',e=>startDrag(e,n.id));
    wrap.appendChild(el);
  });
  applyT();syncBtns();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function lum(hex){const n=parseInt(hex.slice(1),16);return(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255}
function syncBtns(){const n=S.selId&&findN(S.selId);const st=n&&n.style||{};
  const f=$('fsz');if(f)f.textContent=st.fontSize||14;
  const b=$('bB'),i=$('bI'),u=$('bU');
  if(b)b.classList.toggle('on',!!st.bold);if(i)i.classList.toggle('on',!!st.italic);if(u)u.classList.toggle('on',!!st.underline)}
function applyT(){$('world').style.transform=`translate(${S.px}px,${S.py}px) scale(${S.zoom})`;$('zi').textContent=Math.round(S.zoom*100)+'%'}
function zoomBy(f){const w=$('wrap').clientWidth/2,h=$('wrap').clientHeight/2;const nz=Math.max(.15,Math.min(4,S.zoom*f));
  S.px=w-(w-S.px)*(nz/S.zoom);S.py=h-(h-S.py)*(nz/S.zoom);S.zoom=nz;applyT()}
function fit(){if(!boxes.length)return;const w=$('wrap').clientWidth,h=$('wrap').clientHeight;
  let x1=1e9,x2=-1e9,y1=1e9,y2=-1e9;
  boxes.forEach(b=>{x1=Math.min(x1,b._x-b._w/2);x2=Math.max(x2,b._x+b._w/2);y1=Math.min(y1,b._y-b._h/2);y2=Math.max(y2,b._y+b._h/2)});
  S.zoom=Math.max(.15,Math.min(1.6,Math.min(w/(x2-x1+160),h/(y2-y1+160))));
  S.px=w/2-(x1+x2)/2*S.zoom;S.py=h/2-(y1+y2)/2*S.zoom;applyT()}

/* ===== PAN/ZOOM ===== */
let pan=null;
$('wrap').addEventListener('pointerdown',e=>{if(e.target.closest('.nd'))return;pan={x:e.clientX-S.px,y:e.clientY-S.py}});
window.addEventListener('pointermove',e=>{if(!pan)return;S.px=e.clientX-pan.x;S.py=e.clientY-pan.y;applyT()});
window.addEventListener('pointerup',()=>pan=null);
$('wrap').addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY>0?.9:1.1)},{passive:false});

/* ===== EDIT OPS ===== */
function findN(id,n=S.map){if(n.id===id)return n;for(const c of n.children||[]){const f=findN(id,c);if(f)return f}return null}
function findP(id,n=S.map){for(const c of n.children||[]){if(c.id===id)return n;const f=findP(id,c);if(f)return f}return null}
function isDesc(a,id){for(const c of a.children||[]){if(c.id===id||isDesc(c,id))return true}return false}
function mutate(){S.history=S.history.slice(0,S.hi+1);S.history.push(clone(S.map));S.hi++;if(S.history.length>60){S.history.shift();S.hi--}
  S.topic.data=S.map;saveLocal();renderMap()}
function undo(){if(S.hi>0){S.hi--;S.map=clone(S.history[S.hi]);S.topic.data=S.map;saveLocal();renderMap();toast('↶ Undone','ok')}}
function redo(){if(S.hi<S.history.length-1){S.hi++;S.map=clone(S.history[S.hi]);S.topic.data=S.map;saveLocal();renderMap();toast('↷ Redone','ok')}}
function addChild(){if(!S.unlocked)return;const p=S.selId?findN(S.selId):S.map;if(!p)return;
  p.children=p.children||[];const c={id:uid(),text:'New node',children:[]};p.children.push(c);p.collapsed=false;S.selId=c.id;mutate();editSoon(c.id)}
function addSibling(){if(!S.unlocked)return;if(!S.selId||S.selId===S.map.id)return addChild();
  const p=findP(S.selId);if(!p)return;const s={id:uid(),text:'New node',children:[]};
  p.children.splice(p.children.findIndex(c=>c.id===S.selId)+1,0,s);S.selId=s.id;mutate();editSoon(s.id)}
function delSel(){if(!S.unlocked||!S.selId||S.selId===S.map.id)return toast('Root delete করা যাবে না','err');
  const p=findP(S.selId);if(!p)return;p.children=p.children.filter(c=>c.id!==S.selId);S.selId=p.id;mutate();toast('🗑 Deleted (Undo আছে)','ok')}
function fmt(f){if(!S.unlocked||!S.selId)return;const n=findN(S.selId);n.style=n.style||{};n.style[f]=!n.style[f];mutate()}
function fsDelta(d){if(!S.unlocked||!S.selId)return;const n=findN(S.selId);n.style=n.style||{};
  n.style.fontSize=Math.max(9,Math.min(30,(n.style.fontSize||fsOf(n,n._d||0))+d));mutate()}
function setColor(c){if(!S.unlocked||!S.selId)return;const n=findN(S.selId);n.style=n.style||{};
  if(c)n.style.color=c;else delete n.style.color;mutate()}
function collapseAll(v){(function w(n){if((n.children||[]).length)n.collapsed=v;(n.children||[]).forEach(w)})(S.map);S.map.collapsed=false;mutate()}
function editSoon(id){setTimeout(()=>{const el=document.querySelector(`.nd[data-id="${id}"] .txt`);if(el)startEdit(el,findN(id))},60)}
function startEdit(el,n){const old=n.text;el.contentEditable='true';el.focus();document.execCommand('selectAll',false,null);
  const done=()=>{el.contentEditable='false';const t=el.innerText.replace(/\s+/g,' ').trim();if(t&&t!==n.text){n.text=t;mutate()}else renderMap();
    el.removeEventListener('blur',done)};
  el.addEventListener('blur',done);
  el.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el.blur()}if(e.key==='Escape'){el.innerText=old;el.blur()}}}

/* ===== DRAG REARRANGE ===== */
let drag=null;
function startDrag(e,id){
  if(!S.unlocked)return;
  e.preventDefault();e.stopPropagation();
  const el=document.querySelector(`.nd[data-id="${id}"]`);const r=el.getBoundingClientRect();
  const g=el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  document.body.appendChild(g);
  drag={id,g,ox:e.clientX-r.left,oy:e.clientY-r.top,target:null,zone:null};
  el.style.opacity='.35';
}
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  drag.g.style.left=(e.clientX-drag.ox)+'px';drag.g.style.top=(e.clientY-drag.oy)+'px';
  drag.g.style.display='none';
  const t=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('nd')&&x.dataset.id!==drag.id);
  drag.g.style.display='';
  document.querySelectorAll('.dz-before,.dz-after,.dz-child').forEach(x=>x.classList.remove('dz-before','dz-after','dz-child'));
  if(t){const r=t.getBoundingClientRect();const rel=e.clientY-r.top;
    drag.target=t.dataset.id;
    drag.zone=rel<r.height*.28?'before':rel>r.height*.72?'after':'child';
    t.classList.add(drag.zone==='before'?'dz-before':drag.zone==='after'?'dz-after':'dz-child');
  }else{drag.target=null;drag.zone=null}
});
window.addEventListener('pointerup',()=>{
  if(!drag)return;
  document.querySelectorAll('.nd').forEach(x=>{x.style.opacity='1';x.classList.remove('dz-before','dz-after','dz-child')});
  drag.g.remove();
  if(drag.target&&drag.zone)moveNode(drag.id,drag.target,drag.zone);
  drag=null;renderMap();
});
function moveNode(id,tid,zone){
  const n=findN(id);if(!n)return;
  const t=findN(tid);if(!t||isDesc(n,tid))return toast('নিজের child এর ভেতরে রাখা যাবে না','err');
  const op=findP(id);if(!op)return;
  op.children=op.children.filter(c=>c.id!==id);
  if(zone==='child'){t.children=t.children||[];t.children.push(n);t.collapsed=false}
  else{const tp=findP(tid);const a=tp.children;const i=a.findIndex(c=>c.id===tid);a.splice(zone==='before'?i:i+1,0,n)}
  mutate();toast('↔ Node moved','ok');
}

/* ===== AI (robust JSON repair) ===== */
function repairJSON(s){
  s=s.replace(/```json|```/gi,'').trim();
  const st=s.indexOf('{');if(st<0)throw new Error('no JSON');
  s=s.slice(st);
  s=s.replace(/,\s*([}\]])/g,'$1');
  let attempt=s;
  for(let pass=0;pass<3;pass++){
    try{return JSON.parse(balance(attempt))}catch(e){
      const cut=Math.max(attempt.lastIndexOf('}'),attempt.lastIndexOf(']'));
      if(cut<0)throw e;
      attempt=attempt.slice(0,cut+1);
    }
  }
  throw new Error('unrepairable');
}
function balance(s){
  const stack=[];let inStr=false,esc=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(inStr){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')inStr=false;continue}
    if(c==='"'){inStr=true;continue}
    if(c==='{'||c==='[')stack.push(c);
    if(c==='}'||c===']')stack.pop();
  }
  if(inStr)s+='"';
  s=s.replace(/,\s*$/,'');
  while(stack.length){const t=stack.pop();s+=t==='{'?'}':']'}
  return s;
}
async function runAI(){
  const p=$('aiPrompt').value.trim();if(!p)return toast('Prompt লেখো','err');
  closeM('aiModal');toast('✨ AI thinking...');
  try{
    const r=await fetch(CONFIG.AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system:'Return ONLY valid JSON, no markdown. Format: {"id":"root","text":"Title","children":[{"id":"a","text":"short branch","children":[{"id":"a1","text":"short leaf","children":[]}]}]}. Rules: max 6 branches, max 5 leaves each, max 3 levels, every text under 50 characters, include years when relevant.',user:p})});
    const j=await r.json();
    const obj=repairJSON(j.text||'');
    S.map=fixTree(obj);S.topic.data=S.map;S.topic.name=S.map.text;
    S.history=[clone(S.map)];S.hi=0;renderMap();fit();toast('✅ AI map ready','ok');
  }catch(e){toast('AI failed: '+e.message,'err')}
}
function fixTree(o,d=0){
  const n={id:o.id||uid(),text:String(o.text||'Node').slice(0,120),children:[],style:d===0?{color:'#f5b301',bold:true}:{}};
  (o.children||[]).slice(0,12).forEach(c=>n.children.push(fixTree(c,d+1)));
  return n;
}

/* ===== EXPORT ===== */
function exportPNG(){
  const go=()=>html2canvas($('wrap'),{backgroundColor:'#0b0f19',scale:2}).then(c=>{
    const a=document.createElement('a');a.download='mindmap.png';a.href=c.toDataURL();a.click();toast('🖼 PNG exported','ok')});
  if(window.html2canvas)go();
  else{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=go;document.head.appendChild(s)}
}

/* ===== LAYOUT SWITCH / KEYS ===== */
document.querySelectorAll('#laybar button').forEach(b=>b.onclick=()=>{
  S.layout=b.dataset.l;document.querySelectorAll('#laybar button').forEach(x=>x.classList.toggle('on',x===b));renderMap();setTimeout(fit,40)});
window.addEventListener('keydown',e=>{
  if(S.view!=='editor'||e.target.isContentEditable||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(!S.unlocked)return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}
  else if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();redo()}
  else if(e.key==='Tab'){e.preventDefault();addChild()}
  else if(e.key==='Enter'){e.preventDefault();addSibling()}
  else if(e.key===' '){e.preventDefault();const n=S.selId&&findN(S.selId);if(n&&(n.children||[]).length){n.collapsed=!n.collapsed;mutate()}}
  else if(e.key==='Delete'||e.key==='Backspace'){delSel()}
  else if(e.key==='F2'){if(S.selId)editSoon(S.selId)}
});

  if(live)toast('☑ Live data loaded from Google Sheet','ok');
  else if(!loadLocal())S.curriculum=demoCurriculum();
  renderLanding();renderTopbar();
})();
