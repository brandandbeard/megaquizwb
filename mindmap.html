<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Maps — Mega Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#08090c;--panel:rgba(17,19,24,.92);--bd:rgba(255,255,255,.1);--bd2:rgba(255,255,255,.16);
--tx:#fff;--tx2:rgba(255,255,255,.7);--tx3:rgba(255,255,255,.45);--ac:#f5b301}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
#topbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:100;display:flex;align-items:center;gap:.75rem;
padding:0 1rem;background:rgba(8,9,12,.85);backdrop-filter:blur(18px);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:inherit;font-family:'Space Grotesk';font-weight:700}
.logo i{color:var(--ac);font-size:1rem}.logo b span{color:var(--ac)}
#mapTitle{flex:1;max-width:420px;background:transparent;border:1px solid transparent;border-radius:8px;
padding:.45rem .8rem;color:var(--tx);font:600 .9rem Inter;outline:none}
#mapTitle:focus{border-color:var(--bd2);background:rgba(255,255,255,.04)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem .9rem;border-radius:9px;cursor:pointer;
border:1px solid var(--bd2);background:rgba(255,255,255,.04);color:var(--tx2);font:500 .82rem Inter;transition:.15s}
.btn:hover{color:#fff;background:rgba(255,255,255,.09)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#111;font-weight:700}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ic{width:36px;height:36px;padding:0;justify-content:center}
#wrap{position:fixed;inset:56px 0 0;overflow:hidden;cursor:grab;
background:radial-gradient(1200px 600px at 50% 40%,rgba(245,179,1,.05),transparent 60%),var(--bg)}
#wrap:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#segSvg{position:absolute;left:0;top:0;width:10px;height:10px;overflow:visible}
.nd{position:absolute;transform:translate(-50%,-50%);border-radius:9px;padding:8px 14px;
background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);border-left-width:4px;
color:#eef1f6;font-size:13px;line-height:1.35;white-space:pre-line;cursor:pointer;user-select:none;
box-shadow:0 4px 14px rgba(0,0,0,.35);transition:box-shadow .15s,filter .15s;text-align:left}
.nd:hover{filter:brightness(1.25);z-index:5}
.nd.sel{outline:2px solid var(--ac);outline-offset:2px;z-index:6}
.nd.b{font-weight:700;color:#0b0d12;border:none;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.nd.r{font-weight:800;background:linear-gradient(135deg,#ffd34d,#f5b301);color:#141000;border:none;font-size:17px}
.nd .tg{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;
background:#11141a;border:1px solid var(--bd2);color:var(--tx2);font:700 10px/16px Inter;text-align:center;cursor:pointer}
.nd .tg:hover{background:var(--ac);color:#000}
.nd[contenteditable="true"]{outline:2px solid var(--ac);cursor:text;user-select:text}
#toolbar{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:2px;
background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:12px;padding:5px;max-width:calc(100vw - 16px);flex-wrap:wrap}
.tb{width:34px;height:34px;border:none;border-radius:8px;background:transparent;color:var(--tx2);cursor:pointer;font-size:.85rem}
.tb:hover{background:rgba(255,255,255,.08);color:#fff}
.tb.on{background:rgba(245,179,1,.18);color:var(--ac)}
.sep{width:1px;height:22px;background:var(--bd);margin:0 3px}
.dot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;margin:0 2px}
.dot.on{border-color:#fff}
#fsz{min-width:26px;text-align:center;font:600 .72rem 'Space Grotesk';color:var(--tx2)}
#layouts{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:90;display:flex;gap:2px;
background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:5px;backdrop-filter:blur(16px)}
.lay{border:none;background:transparent;color:var(--tx3);cursor:pointer;padding:.5rem .95rem;border-radius:8px;
font:600 .8rem Inter;display:flex;gap:.4rem;align-items:center}
.lay:hover{color:#fff}.lay.on{background:var(--ac);color:#111}
#zoomc{position:fixed;right:14px;bottom:14px;z-index:90;display:flex;flex-direction:column;gap:2px;
background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:5px;backdrop-filter:blur(16px)}
#zoomc button{width:34px;height:34px;border:none;border-radius:8px;background:transparent;color:var(--tx2);cursor:pointer}
#zoomc button:hover{background:rgba(255,255,255,.08);color:#fff}
#zi{font:600 .68rem 'Space Grotesk';color:var(--tx3);text-align:center;padding:2px}
.mbg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
.mbg.show{display:flex}
.modal{width:100%;max-width:470px;background:#12141a;border:1px solid var(--bd2);border-radius:16px;padding:1.6rem;
box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}}
.modal h2{font:700 1.15rem 'Space Grotesk';margin-bottom:1.1rem;display:flex;gap:.5rem;align-items:center}
.modal h2 i{color:var(--ac)}
.f{margin-bottom:1rem}.f label{display:block;font:600 .68rem Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:.35rem}
.in{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd2);border-radius:9px;padding:.7rem .9rem;color:#fff;font:400 .9rem Inter;outline:none}
.in:focus{border-color:var(--ac)}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}
.tabs{display:flex;gap:3px;background:rgba(255,255,255,.05);padding:3px;border-radius:10px;margin-bottom:1.1rem}
.tab{flex:1;border:none;border-radius:8px;background:transparent;color:var(--tx3);cursor:pointer;padding:.55rem;font:600 .8rem Inter}
.tab.on{background:#0b0d12;color:#fff}
.pane{display:none}.pane.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.7rem}
.chip{border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--tx2);border-radius:99px;padding:.32rem .7rem;font:500 .72rem Inter;cursor:pointer}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.mact{display:flex;gap:.6rem;margin-top:1.2rem}.mact .btn{flex:1;justify-content:center;padding:.75rem}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(16px);z-index:300;opacity:0;pointer-events:none;
background:var(--panel);border:1px solid var(--bd2);border-radius:10px;padding:.7rem 1.2rem;font:500 .85rem Inter;
display:flex;gap:.5rem;align-items:center;transition:.25s;backdrop-filter:blur(14px)}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.ok{border-color:#2fbf71;color:#7ee2a8}#toast.err{border-color:#e5484d;color:#ff9a9e}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--tx3);flex-direction:column;gap:.6rem}
#empty i{font-size:2.6rem;color:var(--ac);opacity:.6}
@media(max-width:760px){.btn span{display:none}#mapTitle{display:none}#toolbar{top:60px}.nd{font-size:12px}}
</style>
</head>
<body>

<div id="topbar">
  <a class="logo" href="index.html"><i class="fa-solid fa-brain"></i><b>MEGA&nbsp;<span>QUIZ</span></b></a>
  <input id="mapTitle" value="Indian Modern History (1498–1950)">
  <div class="spacer"></div>
  <button class="btn ic" title="AI Generate" onclick="openCreate('ai')"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
  <button class="btn ic" title="Backup" onclick="openModal('bkModal')"><i class="fa-solid fa-cloud-arrow-up"></i></button>
  <button class="btn ic" title="Export PNG" onclick="exportPNG()"><i class="fa-solid fa-download"></i></button>
  <button class="btn pri" onclick="openCreate('blank')"><i class="fa-solid fa-plus"></i><span>New</span></button>
</div>

<div id="wrap">
  <div id="world">
    <svg id="segSvg"><g id="segG"></g></svg>
    <div id="nodes"></div>
  </div>
  <div id="empty"><i class="fa-solid fa-diagram-project"></i><h3>No mind map</h3>
  <div style="display:flex;gap:.5rem"><button class="btn pri" onclick="openCreate('blank')"><i class="fa-solid fa-plus"></i>Create</button>
  <button class="btn" onclick="openCreate('ai')"><i class="fa-solid fa-wand-magic-sparkles"></i>AI</button></div></div>
</div>

<div id="toolbar">
  <button class="tb" title="Add child (Tab)" onclick="act(mmAddChild)"><i class="fa-solid fa-plus"></i></button>
  <button class="tb" title="Add sibling (Enter)" onclick="act(mmAddSibling)"><i class="fa-solid fa-grip-lines"></i></button>
  <div class="sep"></div>
  <button class="tb" title="Font −" onclick="act(()=>fsDelta(-1))"><i class="fa-solid fa-text-height"></i>−</button>
  <span id="fsz">14</span>
  <button class="tb" title="Font +" onclick="act(()=>fsDelta(1))"><i class="fa-solid fa-text-height"></i>+</button>
  <div class="sep"></div>
  <button class="tb" id="bB" title="Bold" onclick="act(()=>fmt('bold'))"><i class="fa-solid fa-bold"></i></button>
  <button class="tb" id="bI" title="Italic" onclick="act(()=>fmt('italic'))"><i class="fa-solid fa-italic"></i></button>
  <button class="tb" id="bU" title="Underline" onclick="act(()=>fmt('underline'))"><i class="fa-solid fa-underline"></i></button>
  <div class="sep"></div>
  <span class="dot" style="background:#f5b301" onclick="act(()=>setColor('#f5b301'))"></span>
  <span class="dot" style="background:#4f69e8" onclick="act(()=>setColor('#4f69e8'))"></span>
  <span class="dot" style="background:#f29f7c" onclick="act(()=>setColor('#f29f7c'))"></span>
  <span class="dot" style="background:#4caa70" onclick="act(()=>setColor('#4caa70'))"></span>
  <span class="dot" style="background:#ff6384" onclick="act(()=>setColor('#ff6384'))"></span>
  <span class="dot" style="background:#4bc0c0" onclick="act(()=>setColor('#4bc0c0'))"></span>
  <div class="sep"></div>
  <button class="tb" title="Collapse all" onclick="collapseAll(true)"><i class="fa-solid fa-compress"></i></button>
  <button class="tb" title="Expand all" onclick="collapseAll(false)"><i class="fa-solid fa-expand"></i></button>
  <button class="tb" title="Fit" onclick="fit()"><i class="fa-solid fa-crosshairs"></i></button>
  <div class="sep"></div>
  <button class="tb" id="lockB" title="Unlock editing (password)" onclick="toggleLock()"><i class="fa-solid fa-lock"></i></button>
</div>

<div id="layouts">
  <button class="lay on" data-l="timeline" onclick="setLayout('timeline')"><i class="fa-solid fa-timeline"></i><span>Timeline</span></button>
  <button class="lay" data-l="tree" onclick="setLayout('tree')"><i class="fa-solid fa-sitemap"></i><span>Tree</span></button>
  <button class="lay" data-l="radial" onclick="setLayout('radial')"><i class="fa-solid fa-circle-nodes"></i><span>Radial</span></button>
</div>

<div id="zoomc">
  <button onclick="zoomBy(1.25)"><i class="fa-solid fa-plus"></i></button>
  <div id="zi">100%</div>
  <button onclick="zoomBy(0.8)"><i class="fa-solid fa-minus"></i></button>
</div>

<!-- CREATE -->
<div class="mbg" id="crModal"><div class="modal">
  <h2><i class="fa-solid fa-wand-magic-sparkles"></i>New Mind Map</h2>
  <div class="f"><label>Password</label><input class="in" type="password" id="crPwd" placeholder="mindmap0"></div>
  <div class="tabs">
    <button class="tab on" data-t="blank" onclick="tab('blank')">Blank</button>
    <button class="tab" data-t="up" onclick="tab('up')">Upload SVG/JSON</button>
    <button class="tab" data-t="ai" onclick="tab('ai')">AI Generate</button>
  </div>
  <div class="pane on" id="p-blank"><div class="f"><label>Title</label><input class="in" id="bkTitle" placeholder="e.g. World War II"></div></div>
  <div class="pane" id="p-up"><div class="f"><label>File (.svg or .json)</label><input class="in" type="file" id="fileIn" accept=".svg,.json" style="padding:.45rem"></div>
    <div class="f"><label>Title</label><input class="in" id="upTitle" placeholder="Mind map title"></div></div>
  <div class="pane" id="p-ai">
    <div class="chips">
      <span class="chip" onclick="AI.value='Create a chronological timeline mind map of: The French Revolution. Branches = decades/periods, leaves = key events with years.'">French Revolution</span>
      <span class="chip" onclick="AI.value='Create a timeline mind map of: Indian Freedom Struggle 1885-1947 with period branches and dated events.'">Freedom Struggle</span>
      <span class="chip" onclick="AI.value='Create a concept mind map of: Photosynthesis — branches = stages, leaves = details.'">Photosynthesis</span>
    </div>
    <div class="f"><label>Prompt</label><textarea class="in" id="AI" placeholder="Describe your topic…"></textarea></div>
  </div>
  <div class="mact"><button class="btn" onclick="closeModal('crModal')">Cancel</button>
  <button class="btn pri" onclick="doCreate()"><i class="fa-solid fa-bolt"></i>Create</button></div>
</div></div>

<!-- BACKUP -->
<div class="mbg" id="bkModal"><div class="modal">
  <h2><i class="fa-solid fa-cloud-arrow-up"></i>Backup</h2>
  <p style="color:var(--tx3);font-size:.85rem;line-height:1.5;margin-bottom:1rem">Map auto-saved locally. Choose backup destination:</p>
  <div style="display:flex;flex-direction:column;gap:.5rem">
    <button class="btn pri" style="justify-content:center;padding:.85rem" onclick="saveSheet()"><i class="fa-solid fa-table"></i>Save to Google Sheet</button>
    <button class="btn" style="justify-content:center;padding:.8rem" onclick="dlJSON()"><i class="fa-solid fa-file-arrow-down"></i>Download JSON</button>
  </div>
  <div class="mact"><button class="btn" onclick="closeModal('bkModal')">Close</button></div>
</div></div>

<!-- PASSWORD -->
<div class="mbg" id="pwModal"><div class="modal" style="max-width:360px">
  <h2><i class="fa-solid fa-lock"></i>Editing Locked</h2>
  <div class="f"><label>Password</label><input class="in" type="password" id="pwIn" placeholder="mindmap0"></div>
  <div class="mact"><button class="btn" onclick="closeModal('pwModal')">Cancel</button>
  <button class="btn pri" onclick="unlock()"><i class="fa-solid fa-key"></i>Unlock</button></div>
</div></div>

<div id="toast"><i class="fa-solid fa-circle-check"></i><span id="tmsg"></span></div>

<script>
/* ===== CONFIG ===== */
const PASSWORD='mindmap0';
const AI_URL='/api/ai';                       // Vercel: megaquizwb.vercel.app/api/ai
const APPS_SCRIPT='';                          // optional Apps Script web-app URL
const PALETTE=['#4f69e8','#f29f7c','#4caa70','#2566df','#6178eb','#ff6384','#ffce54','#4bc0c0','#9966ff'];
const LS='mq_mindmap_v4';

let map=null, sel=null, layout='timeline', unlocked=false, pending=null;
let zoom=1, panX=0, panY=0, segs=[], boxes=[];

const uid=()=>'n'+Math.random().toString(36).slice(2,9);
const $=id=>document.getElementById(id);

/* ===== DEMO (from your SVG) ===== */
const B=(t,c,ch)=>({id:uid(),text:t,style:{color:c},children:ch});
const L=(t,ch)=>({id:uid(),text:t,children:ch||[]});
const demo={id:uid(),text:'Indian Modern History (1498–1950)',style:{color:'#f5b301',bold:true,fontSize:20},children:[
 B('1498–1550: Sea Route & Early Mughal Rise','#4f69e8',[
   L('1498: Vasco da Gama reaches Calicut with help of Abdul Majid, opening the European sea route to India'),
   L('1505: Francisco de Almeida becomes first Portuguese Governor in India at Cochin'),
   L('1510: Afonso de Albuquerque captures Goa, making it the Portuguese capital in Asia',[
     L('Real founder of Portuguese power in the East'),L('First Indian territory under Europeans'),L('Abolition of sati'),L('Introduced tobacco, cashew nut')]),
   L('1526: Babur defeats Ibrahim Lodi at First Panipat and founds the Mughal Empire'),
   L('1540: Sher Shah Suri defeats Humayun at Kannauj; 1545: dies after Grand Trunk Road reforms')]),
 B('1551–1600: Akbar\'s Empire & English Entry','#f29f7c',[
   L('1556: Akbar crowned at Kalanaur; Second Panipat defeats Hemu'),
   L('1565: Battle of Talikota destroys the Vijayanagara Empire'),
   L('1576: Battle of Haldighati — Rana Pratap of Mewar fights Man Singh\'s army'),
   L('1582: Akbar introduces Din-i-Ilahi, a syncretic faith'),
   L('1598: Abul Fazl completes the Ain-i-Akbari'),
   L('1600: Queen Elizabeth I grants royal charter to the English East India Company')]),
 B('1601–1650: Jahangir, Shah Jahan & English Foothold','#4caa70',[
   L('1608: Captain William Hawkins (ship Hector) seeks trade privileges at Jahangir\'s Agra court'),
   L('1612: Captain Best defeats Portuguese at Swally; English factory set up at Surat'),
   L('1615: Sir Thomas Roe arrives as English ambassador to Jahangir\'s court'),
   L('1632: Shah Jahan begins construction of the Taj Mahal at Agra'),
   L('1639: Francis Day secures land to build Fort St George, Madras'),
   L('1648: Taj Mahal completed; Shahjahanabad founded with the Red Fort')]),
 B('1651–1700: Aurangzeb, Marathas & Company Expansion','#2566df',[
   L('1658: Aurangzeb imprisons Shah Jahan and defeats Dara Shikoh to take the throne'),
   L('1661: Bombay comes to England as dowry from Portugal\'s Catherine of Braganza'),
   L('1664: Shivaji sacks Surat; Colbert founds the French East India Company'),
   L('1674: Shivaji crowned at Raigad; François Martin founds French Pondicherry'),
   L('1690: Job Charnock establishes the English settlement at Sutanuti, Calcutta'),
   L('1699: Guru Gobind Singh founds the Khalsa at Anandpur on Baisakhi day')]),
 B('1701–1750: Mughal Decline & Regional Powers','#6178eb',[
   L('1707: Aurangzeb dies; succession war; Bahadur Shah I takes the throne'),
   L('1717: Farrukhsiyar\'s farman grants the Company duty-free trade in Bengal'),
   L('1720: Baji Rao I becomes Peshwa and expands Maratha power'),
   L('1739: Nadir Shah of Persia sacks Delhi and carries away the Peacock Throne'),
   L('1742: Dupleix becomes French Governor of Pondicherry, intervenes in Carnatic politics'),
   L('1746: French capture Madras (First Carnatic War); 1748: Treaty of Aix-la-Chapelle returns it')]),
 B('1751–1800: Battles, Company Rule & Governor-Generals','#ff6384',[
   L('1751: Robert Clive\'s defence of Arcot establishes British military prestige'),
   L('1757: Battle of Plassey — Clive defeats Siraj-ud-Daulah, opens Company control in Bengal'),
   L('1761: Third Battle of Panipat — Ahmad Shah Abdali defeats the Marathas'),
   L('1764: Battle of Buxar; 1765: Treaty of Allahabad grants Diwani of Bengal, Bihar, Orissa'),
   L('1773: Regulating Act — Warren Hastings first Governor-General of Bengal'),
   L('1793: Cornwallis introduces the Permanent Settlement of Bengal land revenue'),
   L('1799: Tipu Sultan dies at Seringapatam in the Fourth Anglo-Mysore War')]),
 B('1801–1850: Expansion, Reform & Resistance','#ffce54',[
   L('1803: Lord Lake captures Delhi; Shah Alam II under Company protection'),
   L('1813: Charter Act ends the Company\'s monopoly on trade with India'),
   L('1818: Third Anglo-Maratha War ends; Peshwa defeated, Maratha power crushed'),
   L('1829: Bentinck bans sati through Bengal Regulation XVII'),
   L('1835: Macaulay\'s Minute recommends English education'),
   L('1848: Dalhousie applies the Doctrine of Lapse; 1849: Punjab annexed')]),
 B('1851–1900: Revolt, Crown Rule & Congress','#4bc0c0',[
   L('1853: First passenger train Bombay→Thane; Charter Act of 1853'),
   L('1857: Great Revolt begins at Meerut; Bahadur Shah Zafar proclaimed leader'),
   L('1858: Government of India Act transfers power to Crown; Canning first Viceroy'),
   L('1876: Royal Titles Act — Victoria proclaimed Empress of India'),
   L('1885: Indian National Congress founded in Bombay (W.C. Bonnerjee president)'),
   L('1899: Lord Curzon becomes Viceroy; major administrative reforms')]),
 B('1901–1950: Freedom Movement to Republic','#9966ff',[
   L('1905: Partition of Bengal triggers Swadeshi & boycott movement'),
   L('1919: Rowlatt Act; Jallianwala Bagh massacre (13 April); dyarchy introduced'),
   L('1930: Dandi March launches Civil Disobedience; First Round Table Conference'),
   L('1942: Cripps Mission fails; Quit India Movement launched (8 August)'),
   L('1947: Mountbatten last Viceroy; Independence Act creates India & Pakistan'),
   L('1950: Constitution in force (26 January) — India becomes a republic')])]};

/* ===== TEXT MEASURE ===== */
function measure(text,fs,maxW){
  const padX=14,cw=fs*0.56,maxC=Math.max(8,Math.floor((maxW-padX*2)/cw));
  const words=String(text).split(/\s+/),lines=[];let cur='';
  for(const w of words){if((cur+' '+w).trim().length>maxC&&cur){lines.push(cur);cur=w}else cur=(cur?cur+' ':'')+w}
  if(cur)lines.push(cur);
  const widest=Math.max(...lines.map(l=>l.length));
  return{lines,w:Math.min(maxW,widest*cw+padX*2),h:lines.length*(fs*1.32)+16};
}

/* ===== TIMELINE (trunk) LAYOUT ===== */
function layoutTimeline(){
  segs=[];boxes=[];
  const r=map,rm=measure(r.text,r.style?.fontSize||20,430);
  r._x=rm.w/2;r._y=0;r._w=rm.w;r._h=rm.h;r._d=0;r._lines=rm.lines;boxes.push(r);
  let cx=rm.w+70;const TR=rm.w/2+30;
  const branches=(r.children||[]).filter(c=>!r.collapsed);
  branches.forEach((b,i)=>{
    b.style=b.style||{};b.style.color=b.style.color||PALETTE[i%PALETTE.length];
    const bm=measure(b.text,b.style.fontSize||16,300);
    const bx=cx+bm.w/2;
    b._x=bx;b._y=0;b._w=bm.w;b._h=bm.h;b._d=1;b._lines=bm.lines;boxes.push(b);
    const col=b.style.color;
    // flow items
    const leaves=(b.children||[]).filter(c=>!b.collapsed);
    const items=[];
    leaves.forEach(lf=>{
      const lm=measure(lf.text,lf.style?.fontSize||13.5,340);
      items.push({n:lf,m:lm,kind:0});
      (lf.children||[]).filter(c=>!lf.collapsed).forEach(ch=>{
        const cm=measure(ch.text,ch.style?.fontSize||12.5,300);
        items.push({n:ch,m:cm,kind:1,parent:lf});
      });
    });
    const dir=i%2===0?1:-1,gap=26,clear=64;
    let y=dir*(clear);
    const spineX=bx,leafDX=70,chDX=100;
    let lastLeafY=dir*clear,mini=null;
    items.forEach(it=>{
      const yy=y+dir*(it.m.h/2);it.n._y=yy;y+=dir*(it.m.h/2+gap+it.m.h/2);
      if(it.kind===0){
        it.n._x=spineX+leafDX+it.m.w/2;it.n._w=it.m.w;it.n._h=it.m.h;it.n._d=2;it.n._lines=it.m.lines;
        segs.push({x1:spineX,y1:yy,x2:spineX+leafDX,y2:yy,c:col,w:1.5});
        lastLeafY=yy;mini=null;
      }else{
        const msx=spineX+leafDX+45;
        if(!mini){mini={x:msx,y0:it.parent._y+it.parent._h/2*dir*0+ (it.parent._h/2)*dir};segs.push({x1:msx,y1:it.parent._y+(dir*it.parent._h/2),x2:msx,y2:it.parent._y+(dir*it.parent._h/2),c:col,w:1.5});}
        segs.push({x1:msx,y1:yy,x2:msx+chDX-45+0,y2:yy,c:col,w:1.2});
        segs.push({x1:msx,y1:Math.min(maxiY(mini,yy),yy),x2:msx,y2:Math.max(miniY(mini,yy),yy),c:col,w:1.5});
        mini._last=yy;
        it.n._x=msx+chDX+it.m.w/2-45;it.n._w=it.m.w;it.n._h=it.m.h;it.n._d=3;it.n._lines=it.m.lines;
      }
      boxes.push(it.n);
    });
    // fix mini spines: rebuild cleanly
    segs=segs.filter(s=>!s._mini);
    leaves.forEach(lf=>{
      const kids=(lf.children||[]).filter(c=>!lf.collapsed);
      if(!kids.length)return;
      const msx=lf._x-lf._w/2+45;
      segs.push({_mini:1,x1:msx,y1:lf._y+dir*lf._h/2,x2:msx,y2:kids[kids.length-1]._y,c:col,w:1.5});
      kids.forEach(k=>segs.push({_mini:1,x1:msx,y1:k._y,x2:k._x-k._w/2,y2:k._y,c:col,w:1.2}));
    });
    if(items.length)segs.push({x1:spineX,y1:dir*40,x2:spineX,y2:lastLeafY,c:col,w:2});
    cx=Math.max(...boxes.filter(b2=>b2._d>=2).map(b2=>b2._x+b2._w/2),bx+bm.w/2)+80;
  });
  const lastX=branches.length?branches[branches.length-1]._x+60:TR+40;
  segs.unshift({x1:TR-30,y1:0,x2:lastX,y2:0,c:'rgba(255,255,255,.3)',w:3.5,trunk:1});
}
const miniY=(m,y)=>m._last??y, maxiY=(m,y)=>m._last??y;

/* ===== TREE / RADIAL ===== */
function layoutTree(radial){
  segs=[];boxes=[];let slot=0;
  (function walk(n,d){
    n._d=d;const m=measure(n.text,n.style?.fontSize||(d===0?20:d===1?16:13.5),d===0?430:d===1?300:320);
    n._w=m.w;n._h=m.h;n._lines=m.lines;
    const kids=(n.children||[]).filter(c=>!n.collapsed);
    if(!kids.length){n._slot=slot++;}
    else{kids.forEach(k=>walk(k,d+1));n._slot=(kids[0]._slot+kids[kids.length-1]._slot)/2;}
    n._ty=n._slot*96;n._tx=d*340;
    boxes.push(n);
    kids.forEach(k=>{segs.push(radial?{x1:0,y1:0,x2:0,y2:0}:
      {x1:n._tx+n._w/2,y1:n._ty,x2:k._tx-k._w/2,y2:k._ty,c:k.style?.color||'#888',w:1.5});});
  })(map,0);
  if(radial){const maxY=Math.max(...boxes.map(b=>b._ty),1);
    boxes.forEach(n=>{const a=(n._ty/maxY)*Math.PI*2-Math.PI/2,r2=n._tx;
      n._x=Math.cos(a)*r2;n._y=Math.sin(a)*r2;});
    segs=[];boxes.forEach(n=>{(n.children||[]).filter(c=>!n.collapsed).forEach(k=>{
      segs.push({x1:n._x,y1:n._y,x2:k._x,y2:k._y,c:k.style?.color||'#888',w:1.5});});});
  }else boxes.forEach(n=>{n._x=n._tx;n._y=n._ty;});
}

/* ===== RENDER ===== */
function render(){
  if(!map){$('empty').style.display='flex';$('segG').innerHTML='';$('nodes').innerHTML='';return}
  $('empty').style.display='none';
  if(layout==='timeline')layoutTimeline();else layoutTree(layout==='radial');
  $('segG').innerHTML=segs.map(s=>`<line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" stroke="${s.c}" stroke-width="${s.w}" stroke-linecap="round"/>`).join('');
  $('nodes').innerHTML='';
  boxes.forEach(n=>{
    const d=document.createElement('div');
    d.className='nd'+(n._d===0?' r':n._d===1?' b':'')+(sel&&sel.id===n.id?' sel':'');
    d.style.left=n._x+'px';d.style.top=n._y+'px';d.style.width=n._w+'px';
    const st=n.style||{};
    if(n._d===1)d.style.background=st.color||'#888';
    else if(n._d>1)d.style.borderLeftColor=parentColor(n)||'#888';
    if(st.fontSize&&n._d>1)d.style.fontSize=st.fontSize+'px';
    if(st.bold)d.style.fontWeight=700;if(st.italic)d.style.fontStyle='italic';
    if(st.underline)d.style.textDecoration='underline';
    d.textContent=n._lines.join('\n');d.dataset.id=n.id;
    const kids=(n.children||[]);
    if(kids.length){const t=document.createElement('span');t.className='tg';
      t.textContent=n.collapsed?'+'+kids.length:kids.length;
      t.onclick=e=>{e.stopPropagation();n.collapsed=!n.collapsed;render();save();};d.appendChild(t);}
    d.onclick=e=>{e.stopPropagation();sel=n;render();syncToolbar();};
    d.ondblclick=e=>{e.stopPropagation();act(()=>editInline(d,n));};
    $('nodes').appendChild(d);
  });
  applyTransform();syncToolbar();
}
function parentColor(n){let p=null;(function f(x){(x.children||[]).forEach(c=>{if(c===n)p=x;f(c)})})(map);return p?.style?.color}
function applyTransform(){$('world').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;$('zi').textContent=Math.round(zoom*100)+'%'}
function fit(){if(!boxes.length)return;const w=$('wrap').clientWidth,h=$('wrap').clientHeight;
  let x1=1e9,x2=-1e9,y1=1e9,y2=-1e9;boxes.forEach(b=>{x1=Math.min(x1,b._x-b._w/2);x2=Math.max(x2,b._x+b._w/2);
  y1=Math.min(y1,b._y-b._h/2);y2=Math.max(y2,b._y+b._h/2)});
  zoom=Math.min(w/(x2-x1+160),h/(y2-y1+160),1.6);zoom=Math.max(zoom,.15);
  panX=w/2-(x1+x2)/2*zoom;panY=h/2-(y1+y2)/2*zoom;applyTransform();}
function zoomBy(f){const w=$('wrap').clientWidth/2,h=$('wrap').clientHeight/2;const nz=Math.max(.15,Math.min(4,zoom*f));
  panX=w-(w-panX)*(nz/zoom);panY=h-(h-panY)*(nz/zoom);zoom=nz;applyTransform();}
function setLayout(l){layout=l;document.querySelectorAll('.lay').forEach(b=>b.classList.toggle('on',b.dataset.l===l));render();fit();}

/* ===== PAN/ZOOM EVENTS ===== */
(function(){let dr=null,ld=0;const w=$('wrap');
 w.addEventListener('mousedown',e=>{if(e.target.closest('.nd'))return;dr={x:e.clientX-panX,y:e.clientY-panY}});
 addEventListener('mousemove',e=>{if(!dr)return;panX=e.clientX-dr.x;panY=e.clientY-dr.y;applyTransform()});
 addEventListener('mouseup',()=>dr=null);
 w.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY>0?.9:1.1)},{passive:false});
 w.addEventListener('touchstart',e=>{if(e.target.closest('.nd'))return;
   if(e.touches.length===1)dr={x:e.touches[0].clientX-panX,y:e.touches[0].clientY-panY};
   else ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)});
 w.addEventListener('touchmove',e=>{e.preventDefault();
   if(e.touches.length===1&&dr){panX=e.touches[0].clientX-dr.x;panY=e.touches[0].clientY-dr.y;applyTransform()}
   else if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(ld)zoomBy(d/ld);ld=d}},{passive:false});
 w.addEventListener('touchend',()=>{dr=null;ld=0});
 w.addEventListener('click',e=>{if(!e.target.closest('.nd')){sel=null;render()}});
})();

/* ===== EDIT OPS ===== */
function act(fn){if(!unlocked){pending=fn;$('pwIn').value='';openModal('pwModal');return}fn()}
function unlock(){if($('pwIn').value===PASSWORD){unlocked=true;closeModal('pwModal');$('lockB').innerHTML='<i class="fa-solid fa-lock-open"></i>';$('lockB').classList.add('on');toast('Editing unlocked','ok');const f=pending;pending=null;if(f)f();}else toast('Wrong password','err')}
function toggleLock(){if(unlocked){unlocked=false;$('lockB').innerHTML='<i class="fa-solid fa-lock"></i>';$('lockB').classList.remove('on');toast('Locked','ok')}else act(()=>{})}
function fsDelta(d){if(!sel)return;sel.style=sel.style||{};sel.style.fontSize=Math.max(10,Math.min(30,(sel.style.fontSize||14)+d*2));render();save()}
function fmt(f){if(!sel)return;sel.style=sel.style||{};sel.style[f]=!sel.style[f];render();save()}
function setColor(c){if(!sel)return;sel.style=sel.style||{};sel.style.color=c;render();save()}
function mmAddChild(){if(!sel)return toast('Select a node','err');sel.children=sel.children||[];
  const c={id:uid(),text:'New node',children:[]};sel.children.push(c);sel.collapsed=false;sel=c;render();save();editAfter(c)}
function mmAddSibling(){if(!sel||sel===map)return mmAddChild();const p=findP(map,sel.id);if(!p)return;
  const s={id:uid(),text:'New node',children:[]};p.children.splice(p.children.indexOf(sel)+1,0,s);sel=s;render();save();editAfter(s)}
function editAfter(n){setTimeout(()=>{const el=[...document.querySelectorAll('.nd')].find(d=>d.dataset.id===n.id);if(el)editInline(el,n)},60)}
function editInline(el,n){const t=el.childNodes[0];const old=n.text;
  el.contentEditable='true';el.focus();document.execCommand('selectAll',false,null);
  const done=()=>{el.contentEditable='false';n.text=el.textContent.trim()||old;el.removeEventListener('blur',done);render();save()};
  el.addEventListener('blur',done);
  el.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();done()}if(e.key==='Escape'){el.textContent=old;done()}}}
function collapseAll(v){(function f(n){if(n.children&&n.children.length)n.collapsed=v;n.children&&n.children.forEach(f)})(map);map.collapsed=false;render();save()}
function findP(x,id){if(x.children)for(const c of x.children){if(c.id===id)return x;const f=findP(c,id);if(f)return f}return null}
function syncToolbar(){const st=sel?.style||{};$('fsz').textContent=st.fontSize||14;
  $('bB').classList.toggle('on',!!st.bold);$('bI').classList.toggle('on',!!st.italic);$('bU').classList.toggle('on',!!st.underline);
  document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',d.style.background===st.color))}

/* ===== CREATE / AI / UPLOAD ===== */
function openCreate(t){openModal('crModal');tab(t||'blank');$('crPwd').value=''}
function tab(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t))}
function openModal(id){$(id).classList.add('show')}function closeModal(id){$(id).classList.remove('show')}
async function doCreate(){
  if($('crPwd').value!==PASSWORD)return toast('Wrong password','err');
  const active=document.querySelector('.tab.on').dataset.t;
  if(active==='blank'){const t=$('bkTitle').value.trim()||'Untitled';
    map={id:uid(),text:t,style:{color:'#f5b301',bold:true,fontSize:20},children:[
      {id:uid(),text:'Period 1',style:{color:PALETTE[0]},children:[{id:uid(),text:'Event / detail',children:[]}]},
      {id:uid(),text:'Period 2',style:{color:PALETTE[1]},children:[{id:uid(),text:'Event / detail',children:[]}]}]};
    closeModal('crModal');finish(t);}
  else if(active==='up'){const f=$('fileIn').files[0];if(!f)return toast('Choose a file','err');
    const txt=await f.text();
    if(f.name.endsWith('.json')){try{const j=JSON.parse(txt);map=fix(j);closeModal('crModal');finish($('upTitle').value||map.text)}catch(e){toast('Bad JSON','err')}}
    else{map=parseSVG(txt,$('upTitle').value.trim()||'Uploaded map');closeModal('crModal');finish(map.text);toast('SVG parsed','ok')}}
  else{const p=$('AI').value.trim();if(!p)return toast('Write a prompt','err');closeModal('crModal');await genAI(p);}
}
function finish(t){$('mapTitle').value=t;sel=map;render();fit();save()}
async function genAI(prompt){toast('AI thinking…','ok');
  const sys='You are a mind-map generator. Return ONLY valid JSON: {"id":"root","text":title,"style":{"color":"#f5b301","bold":true},"children":[{"id":"x","text":"branch","style":{"color":"#4f69e8"},"children":[{"id":"y","text":"leaf","children":[]}]}]}. 4-9 branches (time periods or themes), 3-7 leaves each, leaves may have 0-3 children. Include years/dates when relevant.';
  try{const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sys,user:prompt})});
    if(!r.ok)throw 0;const d=await r.json();const j=JSON.parse(d.text.replace(/```json|```/g,'').match(/\{[\s\S]*\}/)[0]);
    map=fix(j);finish(map.text);toast('AI map ready','ok');}
  catch(e){toast('AI failed (needs Vercel /api/ai)','err')}}
function fix(o,d=0){const n={id:o.id||uid(),text:String(o.text||'Node'),style:o.style||{},children:[]};
  if(d===0){n.style.color=n.style.color||'#f5b301';n.style.bold=true}
  if(d===1)n.style.color=n.style.color||PALETTE[(o._i||0)%9];
  (o.children||[]).forEach((c,i)=>{c._i=i;n.children.push(fix(c,d+1))});return n}
function parseSVG(txt,title){
  const doc=new DOMParser().parseFromString(txt,'image/svg+xml');
  const ns=[...doc.querySelectorAll('.smm-node')].map(n=>{
    const m=(n.getAttribute('transform')||'').match(/matrix\([^,]+,[^,]+,[^,]+,[^,]+,([^,]+),([^)]+)\)/);
    const x=m?+m[1]:0,y=m?+m[2]:0;
    const tEl=n.querySelector('text');const fs=tEl?parseFloat(tEl.style.fontSize||16):16;
    const texts=[...n.querySelectorAll('text')].map(t=>[...t.querySelectorAll('tspan')].map(s=>s.textContent.trim()).join('')).filter(t=>t&&t.trim()&&t.trim()!=='\ufeff');
    return{x,y,fs,text:texts.join(' ').replace(/\s+/g,' ').trim()};}).filter(n=>n.text);
  if(!ns.length)return{id:uid(),text:title,children:[]};
  ns.sort((a,b)=>a.x-b.x);
  const root=ns[0];const trunkY=root.y;
  const branches=ns.filter(n=>n.fs>=19&&n!==root).sort((a,b)=>a.x-b.x);
  const R={id:uid(),text:root.text,style:{color:'#f5b301',bold:true},children:[]};
  branches.forEach((b,i)=>{
    const bn={id:uid(),text:b.text,style:{color:PALETTE[i%9]},children:[]};R.children.push(bn);
    const nextX=branches[i+1]?branches[i+1].x:1e9;
    const leaves=ns.filter(n=>n.fs<19&&n.x>=b.x+100&&n.x<nextX&&n.x<b.x+400).sort((a,c)=>Math.abs(a.y-trunkY)-Math.abs(c.y-trunkY));
    const kids=ns.filter(n=>n.fs<19&&n.x>=b.x+400&&n.x<nextX).sort((a,c)=>Math.abs(a.y-trunkY)-Math.abs(c.y-trunkY));
    leaves.forEach(l=>bn.children.push({id:uid(),text:l.text,children:[]}));
    kids.forEach(k=>{const p=bn.children.reduce((best,l)=>Math.abs(l._y||0)===0?best:best,bn.children[0]);
      let near=bn.children[0],bd=1e9;bn.children.forEach(l=>{const d=Math.abs(l.y0??(k.y)- (l.y0??k.y));});
      // attach to leaf with closest y
      bd=1e9;bn.children.forEach(l=>{const ly=leaves.find(x=>x.text===l.text);if(ly&&Math.abs(ly.y-k.y)<bd){bd=Math.abs(ly.y-k.y);near=l}});
      (near.children=near.children||[]).push({id:uid(),text:k.text,children:[]});});
  });
  return R;
}

/* ===== SAVE / BACKUP / EXPORT ===== */
function save(){try{localStorage.setItem(LS,JSON.stringify({map,title:$('mapTitle').value,layout}))}catch(e){}}
function dlJSON(){const d={title:$('mapTitle').value,mindMap:map,exportedAt:new Date().toISOString()};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));
  a.download=($('mapTitle').value||'mindmap').replace(/[^a-z0-9]+/gi,'_')+'.json';a.click();toast('JSON downloaded','ok');closeModal('bkModal')}
async function saveSheet(){
  if(!APPS_SCRIPT){toast('Apps Script URL not set — downloading JSON','err');return dlJSON()}
  const p=new URLSearchParams({action:'create',password:PASSWORD,class:'MindMaps',subject:$('mapTitle').value,
    topic:layout,subtopic:'web',mindmapData:JSON.stringify(map),creator:'admin'});
  try{await fetch(APPS_SCRIPT,{method:'POST',mode:'no-cors',body:p});toast('Saved to Sheet','ok')}
  catch(e){toast('Sheet failed — JSON instead','err');dlJSON()}
  closeModal('bkModal')}
function exportPNG(){const s=document.createElement('script');
  if(!window.html2canvas){s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=()=>doExp();document.head.appendChild(s)}else doExp();
  function doExp(){html2canvas($('wrap'),{backgroundColor:'#08090c',scale:2}).then(c=>{
    const a=document.createElement('a');a.download='mindmap.png';a.href=c.toDataURL();a.click();toast('PNG exported','ok')})}}

/* ===== TOAST / KEYS ===== */
function toast(m,t){const e=$('toast');$('tmsg').textContent=m;e.className='show '+(t||'');setTimeout(()=>e.className='',2600)}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return;
  if(!map)return;
  if(e.key==='Tab'){e.preventDefault();act(mmAddChild)}
  else if(e.key==='Enter'){e.preventDefault();act(mmAddSibling)}
  else if(e.key===' '){e.preventDefault();if(sel){sel.collapsed=!sel.collapsed;render();save()}}
  else if(e.key==='F2'&&sel){const el=[...document.querySelectorAll('.nd')].find(d=>d.dataset.id===sel.id);if(el)act(()=>editInline(el,sel))}
  else if((e.ctrlKey||e.metaKey)&&e.key==='b'){e.preventDefault();act(()=>fmt('bold'))}
  else if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();openModal('bkModal')}});
$('mapTitle').addEventListener('input',save);

/* ===== INIT ===== */
(function(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.map){map=s.map;$('mapTitle').value=s.title||map.text;
  if(s.layout){layout=s.layout;document.querySelectorAll('.lay').forEach(b=>b.classList.toggle('on',b.dataset.l===layout))}}}catch(e){}
  if(!map)map=demo;
  sel=map;render();setTimeout(fit,80)})();
