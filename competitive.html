            const tex = new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearMipmapLinearFilter; tex.magFilter=THREE.LinearFilter; tex.generateMipmaps=true; tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=4; return tex;

        const numArms=4, particlesPerArm=2800, galaxyRadius=13, armTightness=2.8;
        const armParticlesTotal=numArms*particlesPerArm; const armPositions=new Float32Array(armParticlesTotal*3), armColors=new Float32Array(armParticlesTotal*3), armSizesArr=new Float32Array(armParticlesTotal);
        for(let arm=0;arm<numArms;arm++){ const baseAngle=arm*Math.PI*2/numArms; for(let i=0;i<particlesPerArm;i++){ const idx=arm*particlesPerArm+i, t=i/particlesPerArm, r=t*galaxyRadius, spiralAngle=baseAngle+t*armTightness*Math.PI, spreadAngle=(0.15+t*1.1)*0.9, angle=spiralAngle+(Math.random()-0.5)*spreadAngle*2; armPositions[idx*3]=Math.cos(angle)*r; armPositions[idx*3+1]=(Math.random()-0.5)*(0.35+t*0.9)*(1+t*1.5); armPositions[idx*3+2]=Math.sin(angle)*r; const wm=Math.max(0,1-t*1.3), cm=Math.max(0,(t-0.25)*1.4); armColors[idx*3]=Math.min(1,0.85*wm+0.35*cm+0.15*Math.random()); armColors[idx*3+1]=Math.min(1,0.7*wm+0.4*cm+0.2*(1-Math.abs(t-0.5)*2)+0.1*Math.random()); armColors[idx*3+2]=Math.min(1,0.4*wm+0.85*cm+0.2*Math.random()); armSizesArr[idx]=(0.03+Math.random()*0.09)*(1-t*0.5); } }
        const armGeom=new THREE.BufferGeometry(); armGeom.setAttribute('position',new THREE.BufferAttribute(armPositions,3)); armGeom.setAttribute('color',new THREE.BufferAttribute(armColors,3)); armGeom.setAttribute('size',new THREE.BufferAttribute(armSizesArr,1));
        const armMat=new THREE.PointsMaterial({size:0.12,map:starSpriteTex,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.85,sizeAttenuation:true}); galaxyGroup.add(new THREE.Points(armGeom,armMat));
        const bulgeCount=2200, bulgeRadius=2.8; const bulgePositions=new Float32Array(bulgeCount*3), bulgeColors=new Float32Array(bulgeCount*3);
        for(let i=0;i<bulgeCount;i++){ const theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1), r=Math.pow(Math.random(),1.8)*bulgeRadius; bulgePositions[i*3]=Math.sin(phi)*Math.cos(theta)*r; bulgePositions[i*3+1]=Math.sin(phi)*Math.sin(theta)*r*0.35; bulgePositions[i*3+2]=Math.cos(phi)*r; const br=0.7+0.3*(1-r/bulgeRadius); bulgeColors[i*3]=br; bulgeColors[i*3+1]=br*0.9; bulgeColors[i*3+2]=br*0.7; }
        const bulgeGeom=new THREE.BufferGeometry(); bulgeGeom.setAttribute('position',new THREE.BufferAttribute(bulgePositions,3)); bulgeGeom.setAttribute('color',new THREE.BufferAttribute(bulgeColors,3));
        const bulgeMat=new THREE.PointsMaterial({size:0.16,map:starSpriteTex,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.9,sizeAttenuation:true}); galaxyGroup.add(new THREE.Points(bulgeGeom,bulgeMat));
        const coreGlowSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:coreGlowTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.75,color:new THREE.Color('#fffef0')})); coreGlowSprite.scale.set(7,7,1); galaxyGroup.add(coreGlowSprite);
        const coreClusterCount=600; const coreClusterPositions=new Float32Array(coreClusterCount*3), coreClusterColors=new Float32Array(coreClusterCount*3);
        for(let i=0;i<coreClusterCount;i++){ const theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1), r=Math.pow(Math.random(),3)*1.2; coreClusterPositions[i*3]=Math.sin(phi)*Math.cos(theta)*r; coreClusterPositions[i*3+1]=Math.sin(phi)*Math.sin(theta)*r*0.3; coreClusterPositions[i*3+2]=Math.cos(phi)*r; coreClusterColors[i*3]=1; coreClusterColors[i*3+1]=0.95; coreClusterColors[i*3+2]=0.8; }
        const coreClusterGeom=new THREE.BufferGeometry(); coreClusterGeom.setAttribute('position',new THREE.BufferAttribute(coreClusterPositions,3)); coreClusterGeom.setAttribute('color',new THREE.BufferAttribute(coreClusterColors,3));
        const coreClusterMat=new THREE.PointsMaterial({size:0.22,map:starSpriteTex,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.95,sizeAttenuation:true}); galaxyGroup.add(new THREE.Points(coreClusterGeom,coreClusterMat));
        const brightStarCount=800; const brightStarPositions=new Float32Array(brightStarCount*3), brightStarColors=new Float32Array(brightStarCount*3);
        for(let i=0;i<brightStarCount;i++){ const arm=Math.floor(Math.random()*numArms), baseAngle=arm*Math.PI*2/numArms, t=Math.random(), r=t*galaxyRadius, spiralAngle=baseAngle+t*armTightness*Math.PI, angle=spiralAngle+(Math.random()-0.5)*0.6; brightStarPositions[i*3]=Math.cos(angle)*r; brightStarPositions[i*3+1]=(Math.random()-0.5)*0.4; brightStarPositions[i*3+2]=Math.sin(angle)*r; const isBlue=Math.random()<0.35; brightStarColors[i*3]=isBlue?0.55+Math.random()*0.3:0.8+Math.random()*0.2; brightStarColors[i*3+1]=isBlue?0.65+Math.random()*0.25:0.75+Math.random()*0.2; brightStarColors[i*3+2]=isBlue?0.9+Math.random()*0.1:0.5+Math.random()*0.4; }
        const brightStarGeom=new THREE.BufferGeometry(); brightStarGeom.setAttribute('position',new THREE.BufferAttribute(brightStarPositions,3)); brightStarGeom.setAttribute('color',new THREE.BufferAttribute(brightStarColors,3));
        const brightStarMat=new THREE.PointsMaterial({size:0.28,map:starSpriteTex,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.8,sizeAttenuation:true}); galaxyGroup.add(new THREE.Points(brightStarGeom,brightStarMat));
        function createNebulaSprite(c1,c2,size,op=0.4){ const c=document.createElement('canvas'); c.width=512; c.height=512; const ctx=c.getContext('2d'); const g=ctx.createRadialGradient(256,256,0,256,256,256); g.addColorStop(0,c1); g.addColorStop(0.5,c2); g.addColorStop(1,'transparent'); ctx.fillStyle=g; ctx.fillRect(0,0,512,512); ctx.globalCompositeOperation='overlay'; for(let i=0;i<100;i++){ ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.05})`; ctx.beginPath(); ctx.arc(Math.random()*512,Math.random()*512,Math.random()*20,0,Math.PI*2); ctx.fill(); } const tex=new THREE.CanvasTexture(c); const mat=new THREE.SpriteMaterial({map:tex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:op}); const s=new THREE.Sprite(mat); s.scale.set(size,size,1); return s; }
        const nebula1=createNebulaSprite('#442288','#220066',35,0.25); nebula1.position.set(5,-2,-10); scene.add(nebula1);
        const nebula2=createNebulaSprite('#882244','#440022',30,0.2); nebula2.position.set(-8,3,-12); scene.add(nebula2);
        const bgStarCount=3000; const bgStarPositions=new Float32Array(bgStarCount*3), bgStarColors=new Float32Array(bgStarCount*3); const bgRadius=55;
        for(let i=0;i<bgStarCount;i++){ const theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1), r=20+Math.random()*(bgRadius-20); bgStarPositions[i*3]=Math.sin(phi)*Math.cos(theta)*r; bgStarPositions[i*3+1]=Math.sin(phi)*Math.sin(theta)*r; bgStarPositions[i*3+2]=Math.cos(phi)*r; const br=0.4+Math.random()*0.6, tint=Math.random(); bgStarColors[i*3]=br*(0.7+tint*0.3); bgStarColors[i*3+1]=br*(0.7+tint*0.3); bgStarColors[i*3+2]=br*(0.8+tint*0.2); }
        const bgStarGeom=new THREE.BufferGeometry(); bgStarGeom.setAttribute('position',new THREE.BufferAttribute(bgStarPositions,3)); bgStarGeom.setAttribute('color',new THREE.BufferAttribute(bgStarColors,3));
        const bgStarMat=new THREE.PointsMaterial({size:0.08,map:starSpriteTex,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.7,sizeAttenuation:true}); const bgStars=new THREE.Points(bgStarGeom,bgStarMat); scene.add(bgStars);

        // Planets without rings, size restored to original (scale 1.0)
        function createPortal(glowTex, mainColorHex, sphereTex){
            const g = new THREE.Group();
            const glow = new THREE.Sprite(new THREE.SpriteMaterial({
                map: glowTex,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.7,
                color: new THREE.Color(mainColorHex)
            }));
            glow.scale.set(6.5, 6.5, 1);
            g.add(glow);

            // Planet sphere with original size (scale 1.0)
            const sphereG = new THREE.SphereGeometry(1.15, 64, 64);
            const sphereM = new THREE.MeshStandardMaterial({
                map: sphereTex,
                color: new THREE.Color('#ffffff'),
                emissive: new THREE.Color(mainColorHex),
                emissiveIntensity: 0.5,
                roughness: 0.28,
                metalness: 0.05
            });
            const sphere = new THREE.Mesh(sphereG, sphereM);
            sphere.name = 'portalSphere';
            sphere.scale.set(1, 1, 1); // back to original size
            g.add(sphere);

            // Small inner core
            const coreG = new THREE.SphereGeometry(0.35, 32, 32);
            const coreM = new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.85 });
            const core = new THREE.Mesh(coreG, coreM);
            core.scale.set(1, 1, 1);
            g.add(core);

            // Orbiting particles
            const orbitPC = 120;
            const orbitPos = new Float32Array(orbitPC * 3);
            const orbitCol = new Float32Array(orbitPC * 3);
            for (let i = 0; i < orbitPC; i++) {
                const ang = (i / orbitPC) * Math.PI * 2;
                const rad = 1.9 + (Math.random() - 0.5) * 0.35;
                orbitPos[i * 3] = Math.cos(ang) * rad;
                orbitPos[i * 3 + 1] = (Math.random() - 0.5) * 0.25;
                orbitPos[i * 3 + 2] = Math.sin(ang) * rad;
                orbitCol[i * 3] = 1;
                orbitCol[i * 3 + 1] = 0.85;
                orbitCol[i * 3 + 2] = 0.6;
            }
            const orbitGeom = new THREE.BufferGeometry();
            orbitGeom.setAttribute('position', new THREE.BufferAttribute(orbitPos, 3));
            orbitGeom.setAttribute('color', new THREE.BufferAttribute(orbitCol, 3));
            const orbitMat = new THREE.PointsMaterial({
                size: 0.06,
                map: starSpriteTex,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.75,
                sizeAttenuation: true
            });
            g.add(new THREE.Points(orbitGeom, orbitMat));

            g.userData = {
                orbitParticles: g.children[g.children.length - 1],
                glowSprite: glow
                // No rings
            };
            return g;
        }

        const portalSSC = createPortal(glowTexSSC, '#ffb74d', portalTexSSC);
        const portalDefence = createPortal(glowTexDefence, '#ef5350', portalTexDefence);
        const portalWBExam = createPortal(glowTexWBExam, '#4dd0e1', portalTexWBExam);

        const pivSSC = new THREE.Group(), pivDef = new THREE.Group(), pivWB = new THREE.Group();
        pivSSC.add(portalSSC); pivDef.add(portalDefence); pivWB.add(portalWBExam);
        portalSSC.position.set(7.5, 4.2, 0);
        portalDefence.position.set(8.2, 2.8, 0);
        portalWBExam.position.set(7.8, 5.0, 0);
        pivSSC.rotation.y = 0; pivDef.rotation.y = Math.PI * 2 / 3; pivWB.rotation.y = Math.PI * 4 / 3;
        scene.add(pivSSC); scene.add(pivDef); scene.add(pivWB);

        const portalData = [
            { pivot: pivSSC, group: portalSSC, url: 'ssc.html', baseY: 4.2, bobOffset: 0 },
            { pivot: pivDef, group: portalDefence, url: 'defence.html', baseY: 2.8, bobOffset: Math.PI * 0.7 },
            { pivot: pivWB, group: portalWBExam, url: 'wbpsc.html', baseY: 5.0, bobOffset: Math.PI * 1.4 }
        ];

        const clickable = [];
        portalData.forEach(p => p.group.traverse(ch => {
            if (ch.isMesh && ch.geometry.type === 'SphereGeometry') {
                ch.userData.pd = p;
                clickable.push(ch);
            }
        }));

        const raycaster = new THREE.Raycaster();
        raycaster.params.Points.threshold = 1.5;
        const mouse = new THREE.Vector2();
        let hovered = null;

        function intersect(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            return raycaster.intersectObjects(clickable, false);
        }

        function applyHov(p, s) {
            p.group.children.forEach(ch => {
                if (ch.isMesh && ch.geometry.type === 'SphereGeometry') ch.scale.setScalar(s);
            });
            if (p.group.userData.glowSprite) p.group.userData.glowSprite.scale.set(7.5, 7.5, 1);
        }

        function resetHov() {
            if (!hovered) return;
            hovered.group.children.forEach(ch => {
                if (ch.isMesh && ch.geometry.type === 'SphereGeometry') ch.scale.setScalar(1);
            });
            if (hovered.group.userData.glowSprite) hovered.group.userData.glowSprite.scale.set(6.5, 6.5, 1);
        }

        canvas.addEventListener('mousemove', e => {
            const its = intersect(e);
            if (its.length) {
                const obj = its[0].object;
                if (obj.userData.pd) {
                    canvas.style.cursor = 'pointer';
                    if (hovered !== obj.userData.pd) {
                        resetHov();
                        hovered = obj.userData.pd;
                        applyHov(hovered, 1.18);
                    }
                    return;
                }
            }
            canvas.style.cursor = 'default';
            if (hovered) {
                resetHov();
                hovered = null;
            }
        });

        canvas.addEventListener('click', e => {
            const its = intersect(e);
            if (its.length && its[0].object.userData.pd) window.location.href = its[0].object.userData.pd.url;
        });

        canvas.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                const t = e.touches[0];
                const fake = { clientX: t.clientX, clientY: t.clientY };
                canvas.dispatchEvent(new MouseEvent('mousemove', fake));
                canvas.dispatchEvent(new MouseEvent('click', fake));
            }
        }, { passive: true });

        const clock = new THREE.Clock();
        function animate(ts) {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            const el = ts * 0.001;
            const sp = 0.12;

            pivSSC.rotation.y += sp * dt;
            pivDef.rotation.y += sp * 0.85 * dt;
            pivWB.rotation.y += sp * 0.92 * dt;

            portalData.forEach(p => {
                const bob = Math.sin(el * 0.55 + p.bobOffset) * 0.7;
                p.group.position.y = p.baseY + bob;

                // Orbit particles rotation
                if (p.group.userData.orbitParticles) p.group.userData.orbitParticles.rotation.y += 0.9 * dt;

                // Glow animation
                if (p.group.userData.glowSprite) {
                    const pulse = 1 + Math.sin(el * 1.8 + p.bobOffset) * 0.12;
                    const bs = (hovered === p) ? 7.5 : 6.5;
                    p.group.userData.glowSprite.scale.setScalar(bs * pulse);
                    p.group.userData.glowSprite.material.opacity = (hovered === p) ? 0.85 : 0.6 + Math.sin(el * 1.8 + p.bobOffset) * 0.1;
                }
            });

            galaxyGroup.rotation.y += 0.025 * dt;
            bgStars.rotation.y += 0.008 * dt;
            bgStars.rotation.x += 0.004 * dt;
            nebula1.rotation.z += 0.001 * dt;
            nebula2.rotation.z -= 0.001 * dt;

            const cp = 1 + Math.sin(el * 0.7) * 0.06;
            coreGlowSprite.scale.set(7 * cp, 7 * cp, 1);
            coreGlowSprite.material.opacity = 0.7 + Math.sin(el * 0.9) * 0.08;

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(onResize, 200), { passive: true });

        requestAnimationFrame(animate);
        window.addEventListener('keydown', e => {
            if (e.key === '1') window.location.href = 'ssc.html';
            if (e.key === '2') window.location.href = 'defence.html';
            if (e.key === '3') window.location.href = 'wbpsc.html';
        });
        console.log('%c🚀 মহাজাগতিক জ্ঞানের দ্বার প্রস্তুত! %c| Cosmic Knowledge Portal Ready', 'font-size:1.3em;color:#FFB74D;', 'color:#aaa;');
    </script>
