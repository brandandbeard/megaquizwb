<script>
const CLASS_CONFIGS = {
  gk: { title:"GK", password:"ggk", tsv:"https://docs.google.com/spreadsheets/d/e/2PACX-1vSlvgL0wNeBT9WLIh-_aAwCO4JmyPUeWyqORWaIOxdqA09KndBPCP0A_GL0xny3JIp3TmhzNKFPXwAu/pub?output=tsv", subjects:"সাধারণ জ্ঞান" },
  ssc: { title:"SSC", password:"@competitive", tsv:"https://docs.google.com/spreadsheets/d/e/2PACX-1vQSNigFSr_yf4GGnyrzDYJJuETzyLjGvfYjXwvuXLGzKcRZRghA23hDOZEQW2-fJdmZR6Nk4g2hFg7U/pub?output=tsv", subjects:"SSC Competitive" },
  wbpsc: { title:"WBPSC", password:"westbengal", tsv:"https://docs.google.com/spreadsheets/d/e/2PACX-1vTPCbxSue4I4aRFkf6wu3kR_Iyzj2Rq6MEVZ4y-SIeuU1DcJml6bbeG6BpH3UEoXz7O-tEesnkTTNSl/pub?output=tsv", subjects:"WBPSC" },
  defence: { title:"Defence", password:"india", tsv:"https://docs.google.com/spreadsheets/d/e/2PACX-1vReSms5LcUXVKsNiBpmwN-MBvoAPxBtScjgFJUAxqZqzxMqxrycOPbROAh1f6EDKNVU9DD_RpLY-B9z/pub?output=tsv", subjects:"Defence" }
};

function detectClass(){
  const params = new URLSearchParams(window.location.search);
  const c = (params.get('c') || 'ssc').toLowerCase().trim();
  return CLASS_CONFIGS[c] ? c : 'ssc';
}

const CURRENT_CLASS = detectClass();
const CONFIG = CLASS_CONFIGS[CURRENT_CLASS];
const SHEET_TSV_URL = CONFIG.tsv;
const CORRECT_PASSWORD = CONFIG.password;

const APP_VERSION = "comp_" + CURRENT_CLASS + "_v2";
const BANK_KEY = "COMP_BANK_" + APP_VERSION;
const SESSION_KEY = "COMP_SESSION_" + APP_VERSION;
const SELECTED_KEY = "COMP_SELECTED_" + APP_VERSION;
const THEME_KEY = "COMP_THEME_" + CURRENT_CLASS;
const LAST_SYNC_KEY = "COMP_SYNC_" + APP_VERSION;
const ACCORDION_STATE_KEY = "COMP_ACCORDION_" + APP_VERSION;

document.title = CONFIG.title + " || Competitive Quiz";
document.getElementById('mainTitle').innerHTML = '🏆 ' + CONFIG.title + ' <small>| ' + CONFIG.subjects + ' |</small>';
document.getElementById('gateSubtitle').textContent = CONFIG.title + ' · ' + CONFIG.subjects;

let openAccordions = new Set();

function loadAccordionState(){
  openAccordions = new Set();
  try {
    const s = localStorage.getItem(ACCORDION_STATE_KEY);
    if(s) openAccordions = new Set(JSON.parse(s));
  } catch(e){}
}

function saveAccordionState(){
  try {
    localStorage.setItem(ACCORDION_STATE_KEY, JSON.stringify([...openAccordions]));
  } catch(e){}
}

const $ = id => document.getElementById(id);

function safeGet(k){
  try { return localStorage.getItem(k); } catch { return null; }
}
function safeSet(k,v){
  try { localStorage.setItem(k,v); } catch {}
}
function safeRemove(k){
  try { localStorage.removeItem(k); } catch {}
}
function cloneValue(v){
  return v === null || v === undefined ? v : typeof structuredClone === "function" ? structuredClone(v) : JSON.parse(JSON.stringify(v));
}

function getSubjectGroups(){
  return questionBank.__subjectGroups__ || [];
}

function buildDefaultBank(){
  return { __subjectGroups__: [], __subjects__: [] };
}

function normalizeBank(bank){
  if(!bank || typeof bank !== "object") bank = buildDefaultBank();
  if(!Array.isArray(bank.__subjectGroups__)) bank.__subjectGroups__ = [];
  if(!Array.isArray(bank.__subjects__)) bank.__subjects__ = [];

  bank.__subjects__ = bank.__subjects__.map((s,i)=>({
    key: String(s.key || ("custom_" + i)),
    group: s.group || "",
    name: String(s.name || ("Topic " + (i+1))),
    num: Number(s.num || i+1)
  }));

  for(const s of bank.__subjects__){
    if(!Array.isArray(bank[s.key])) bank[s.key] = [];
    bank[s.key] = bank[s.key].map(normalizeQuestion).filter(Boolean);
  }

  return bank;
}

function normalizeQuestion(q){
  if(!q) return null;

  const opts = q.o || q.options || q.opts;
  const ans = q.a !== undefined ? q.a : q.correct;
  const txt = q.q || q.question || q.text;

  if(!txt || !Array.isArray(opts) || opts.length !== 4) return null;

  const c = Number(ans);
  if(!Number.isInteger(c) || c < 0 || c > 3) return null;

  const norm = {
    q: String(txt),
    o: opts.map(String),
    a: c,
    note: String(q.note || q.explanation || ""),
    difficulty: String(q.difficulty || "medium")
  };

  if(q._sheetRowIndex !== undefined) norm._sheetRowIndex = q._sheetRowIndex;
  if(q._aiGenerated) norm._aiGenerated = true;
  if(q._aiChecked) norm._aiChecked = true;

  return norm;
}

function loadJson(key, fb){
  try {
    const r = safeGet(key);
    return r === null ? cloneValue(fb) : JSON.parse(r);
  } catch {
    return cloneValue(fb);
  }
}

function saveBank(){
  safeSet(BANK_KEY, JSON.stringify(questionBank));
  populateSubjectsUI();
}

function saveSelection(){
  safeSet(SELECTED_KEY, JSON.stringify([...selectedKeys]));
}

function saveQuizState(){
  safeSet(SESSION_KEY, JSON.stringify({
    questions: currentQuestions,
    answers: userAnswers,
    status: answerStatus,
    index: currentIndex,
    total: totalQuestions,
    quizSize: $("quizSize").value,
    timeLimit: $("timeLimit").value,
    quizMode: quizMode,
    timeRemaining: timeRemaining,
    timerActive: timerActive,
    quizSubmitted: quizSubmitted,
    optionsVisible: optionsVisible,
    optionsHidden: optionsHidden,
    generatedBy: quizGeneratedBy,
    quizTimeLimit: quizTimeLimit
  }));
}

function loadQuizState(){
  const st = loadJson(SESSION_KEY, null);
  if(!st || !st.questions?.length) return false;

  currentQuestions = st.questions;
  userAnswers = st.answers || [];
  answerStatus = st.status || [];
  currentIndex = Math.min(st.index || 0, currentQuestions.length - 1);
  totalQuestions = st.total || currentQuestions.length;

  $("quizSize").value = st.quizSize || 25;
  $("timeLimit").value = st.timeLimit || 30;

  quizMode = st.quizMode || "practice";
  timeRemaining = st.timeRemaining ?? null;
  timerActive = st.timerActive || false;
  quizSubmitted = st.quizSubmitted || false;
  optionsVisible = st.optionsVisible !== undefined ? st.optionsVisible : true;
  optionsHidden = st.optionsHidden || false;
  quizGeneratedBy = st.generatedBy || null;
  quizTimeLimit = st.quizTimeLimit ?? null;

  updateModeButtons();

  if(quizMode === "mock" && timerActive && timeRemaining !== null && timeRemaining > 0){
    startTimer(timeRemaining);
  }

  renderQuiz();
  renderNav();
  updateScore();
  return true;
}

function getSubjects(){
  return questionBank.__subjects__ || [];
}

function getCount(k){
  return questionBank[k]?.length || 0;
}

function groupLabel(gk){
  const groups = getSubjectGroups();
  const found = groups.find(g => g.key === gk);
  return found ? found.name.replace(/^[^\s]+ /,"") : gk;
}

function getQuestionRef(sk, idx){
  const s = getSubjects().find(x => x.key === sk);
  const q = questionBank[sk]?.[idx];
  if(!s || !q) return null;

  return {
    ...q,
    _subject: sk,
    _index: idx,
    _chapterName: s.name,
    _groupName: groupLabel(s.group)
  };
}

function getRandomColorExcluding(ex){
  const all = ['gk','aptitude','reasoning','english','science_comp','current'];
  const av = all.filter(c => !ex.includes(c));
  if(av.length === 0) return all[Math.floor(Math.random()*all.length)];
  return av[Math.floor(Math.random()*av.length)];
}

function populateSubjectsUI(){
  const groups = getSubjectGroups();

  $("subjectAccordions").innerHTML = groups.map((g, gi)=>{
    const isOpen = gi === 0 || openAccordions.has(g.key);
    const chs = getSubjects().filter(s => s.group === g.key);
    const allChaptersSelected = chs.length > 0 && chs.every(s => selectedKeys.has(s.key));
    const checkboxClass = allChaptersSelected ? 'subject-checkbox checked' : 'subject-checkbox';

    return `<div class="subject-accordion ${isOpen ? "open" : ""}">
      <div class="subject-header ${g.className || ''}" data-group="${g.key}">
        <div style="display:flex;align-items:center;gap:8px;flex:1;">
          <div class="${checkboxClass}" data-subject-group="${g.key}" onclick="event.stopPropagation();toggleSubjectSelection('${g.key}')"></div>
          <span style="flex:1;">${escapeHtml(g.name)}</span>
        </div>
        <span class="subject-arrow">▼</span>
      </div>
      <div class="subject-chapters ${isOpen ? "open" : ""}">
        <div class="subject-chapters-inner">
          ${chs.map(s=>`<label class="chapter-item"><input type="checkbox" class="chapter-cb" value="${escapeAttr(s.key)}" ${selectedKeys.has(s.key) ? "checked" : ""}><span>${escapeHtml(s.name)}</span><span class="q-count">[${getCount(s.key)}]</span></label>`).join("") || "<span style='font-size:13px;color:#64748b'>এই গ্রুপে কোনো chapter নেই।</span>"}
        </div>
      </div>
    </div>`;
  }).join("");

  document.querySelectorAll(".subject-header").forEach(h=>{
    h.onclick = (e)=>{
      if(e.target.classList.contains('subject-checkbox') || e.target.closest('.subject-checkbox')) return;

      const a = h.closest(".subject-accordion");
      const b = a.querySelector(".subject-chapters");
      const gk = h.dataset.group;

      a.classList.toggle("open");
      b.classList.toggle("open");

      if(a.classList.contains("open")) openAccordions.add(gk);
      else openAccordions.delete(gk);

      saveAccordionState();
    };
  });

  document.querySelectorAll(".chapter-cb").forEach(cb=>{
    cb.onchange = ()=>{
      cb.checked ? selectedKeys.add(cb.value) : selectedKeys.delete(cb.value);
      saveSelection();
      populateSubjectsUI();
    };
  });
}

function toggleSubjectSelection(groupKey){
  const chaptersInSubject = getSubjects().filter(s => s.group === groupKey);
  const allSelected = chaptersInSubject.every(s => selectedKeys.has(s.key));

  if(allSelected){
    chaptersInSubject.forEach(s => selectedKeys.delete(s.key));
  } else {
    chaptersInSubject.forEach(s => selectedKeys.add(s.key));
  }

  saveSelection();
  populateSubjectsUI();
}
window.toggleSubjectSelection = toggleSubjectSelection;

function getSelectedKeys(){
  const ks = [];
  document.querySelectorAll(".chapter-cb:checked").forEach(cb => ks.push(cb.value));
  return ks;
}

function shuffle(arr){
  const c = [...arr];
  for(let i=c.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [c[i],c[j]] = [c[j],c[i]];
  }
  return c;
}

function shuffleOptions(q){
  const o = shuffle([0,1,2,3]);
  const shuffled = {...q, o: o.map(i=>q.o[i]), a: o.indexOf(q.a)};

  if(q._sheetRowIndex !== undefined) shuffled._sheetRowIndex = q._sheetRowIndex;
  if(q._aiGenerated) shuffled._aiGenerated = true;
  if(q._aiChecked) shuffled._aiChecked = true;

  return shuffled;
}

function collectQuestions(ks){
  const all = [];
  for(const k of ks){
    (questionBank[k] || []).forEach((_,i)=>{
      const r = getQuestionRef(k,i);
      if(r) all.push(r);
    });
  }
  return all;
}

function generateQuiz(ks, sz, rnd=false){
  if(!ks.length){
    alert("⚠️ কোনো subject selected নেই! 'Select Subjects' থেকে chapter select করুন।");
    return;
  }

  let sel = collectQuestions(ks);

  if(!sel.length){
    alert("No questions! Sheet থেকে sync করুন।");
    return;
  }

  if(rnd) sel = shuffle(sel);

  currentQuestions = sel.slice(0, Math.max(1, sz || 25)).map(shuffleOptions);
  totalQuestions = currentQuestions.length;

  userAnswers = new Array(totalQuestions).fill(null);
  answerStatus = new Array(totalQuestions).fill(false);

  currentIndex = 0;
  quizSubmitted = false;
  optionsVisible = true;
  optionsHidden = false;
  quizGeneratedBy = rnd ? 'random' : 'seq';
  quizTimeLimit = parseInt($("timeLimit").value) || 30;

  stopTimer();
  timeRemaining = null;
  timerActive = false;

  if(quizMode === "mock"){
    const tl = parseInt($("timeLimit").value) || 30;
    timeRemaining = tl * 60;
    startTimer(timeRemaining);
  }

  renderQuiz();
  renderNav();
  updateScore();
  updateTimerDisplay();
  saveQuizState();
}

function showSyncStatus(m, ok=true){
  $("syncStatus").innerHTML = `<span style="color:${ok ? '#0d9488' : '#dc2626'};font-weight:600">${ok ? '🦥' : '❌'} ${escapeHtml(m)}</span>`;
  setTimeout(() => $("syncStatus").innerHTML = "", 3500);
}

async function syncFromSheet(url){
  if(!url) return;

  try{
    showSyncStatus("Load হচ্ছে....", true);

    const res = await fetch(url, {mode:'cors'});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);

    const tsv = await res.text();
    const rows = tsv.split(/\r?\n/);

    if(rows.length < 2) return;

    const dataRows = rows.slice(1);
    const parsedRows = [];

    let actualSheetRowNumber = 2;

    for(const row of dataRows){
      const cols = row.split('\t').map(c => c.trim());

      if(cols.length >= 8 && cols[3] && cols[3].trim() !== ''){
        const chapterNum = parseInt(cols[0]) || 9999;
        const gRaw = cols[1] || 'সাধারণ';
        const cRaw = cols[2] || 'অশ্রেণীবদ্ধ';
        const qText = cols[3];

        const opts = [cols[4], cols[5], cols[6], cols[7]];

        let correctIdx = parseInt(cols[8]);

        if(isNaN(correctIdx)){
          const map = {'A':0,'B':1,'C':2,'D':3,'a':0,'b':1,'c':2,'d':3};
          const letter = (cols[8] || '').trim().toUpperCase();

          if(letter in map) correctIdx = map[letter];
          else {
            actualSheetRowNumber++;
            continue;
          }
        }

        if(correctIdx < 0 || correctIdx > 3){
          actualSheetRowNumber++;
          continue;
        }

        const manualExplanation = cols.length > 9 ? cols[9] : '';
        const colK = cols.length > 10 ? cols[10] : '';
        const aiChecked = cols.length > 11 && String(cols[11]).indexOf('AI-CHECKED') !== -1;

        let explanation = manualExplanation;
        let difficulty = 'medium';

        if(['easy','medium','hard'].includes(String(colK).toLowerCase())){
          difficulty = String(colK).toLowerCase();
        } else if(colK && !manualExplanation){
          explanation = colK;
        }

        parsedRows.push({
          chapterNum,
          gRaw,
          cRaw,
          qText,
          opts,
          correctIdx,
          explanation,
          difficulty,
          sheetRow: actualSheetRowNumber,
          aiChecked
        });
      }

      actualSheetRowNumber++;
    }

    if(parsedRows.length === 0){
      showSyncStatus("Sheet এ কোনো valid data নেই।", false);
      return;
    }

    questionBank = {
      __subjectGroups__: [],
      __subjects__: []
    };

    const chapterKeyMap = new Map();
    const chapterOrderMap = new Map();

    for(let i=0; i<parsedRows.length; i++){
      const row = parsedRows[i];
      const mappedG = row.gRaw;
      const mappedC = row.cRaw;

      let group = questionBank.__subjectGroups__.find(g => g.name === mappedG);

      if(!group){
        const key = mappedG.toLowerCase().replace(/[^a-z0-9\u0980-\u09FF]/g,'_') + '_g_' + Date.now() + i;
        const existingColors = questionBank.__subjectGroups__.map(g => g.className).filter(Boolean);
        const newColor = getRandomColorExcluding(existingColors);

        group = {
          key,
          name: mappedG,
          className: newColor
        };

        questionBank.__subjectGroups__.push(group);
      }

      let chapter = questionBank.__subjects__.find(s => s.name === mappedC && s.group === group.key);

      if(!chapter){
        const key = mappedC.toLowerCase().replace(/[^a-z0-9\u0980-\u09FF]/g,'_') + '_c_' + Date.now() + i;

        chapter = {
          key,
          name: mappedC,
          group: group.key,
          num: questionBank.__subjects__.length + 1
        };

        questionBank.__subjects__.push(chapter);
        questionBank[key] = [];
      }

      chapterKeyMap.set(i, chapter.key);

      if(!chapterOrderMap.has(chapter.key) || row.chapterNum < chapterOrderMap.get(chapter.key)){
        chapterOrderMap.set(chapter.key, row.chapterNum);
      }
    }

    const subjectsList = [...questionBank.__subjects__];

    subjectsList.sort((a,b)=>{
      const groupA = questionBank.__subjectGroups__.findIndex(g => g.key === a.group);
      const groupB = questionBank.__subjectGroups__.findIndex(g => g.key === b.group);

      if(groupA !== groupB) return groupA - groupB;

      const orderA = chapterOrderMap.get(a.key) || 9999;
      const orderB = chapterOrderMap.get(b.key) || 9999;

      return orderA - orderB;
    });

    questionBank.__subjects__ = subjectsList;

    for(let i=0; i<parsedRows.length; i++){
      const row = parsedRows[i];
      const chapKey = chapterKeyMap.get(i);

      const q = normalizeQuestion({
        q: row.qText,
        o: row.opts,
        a: row.correctIdx,
        note: row.explanation,
        difficulty: row.difficulty
      });

      if(q){
        q._sheetRowIndex = row.sheetRow;
        if(row.aiChecked) q._aiChecked = true;
        questionBank[chapKey].push(q);
      }
    }

    saveBank();

    selectedKeys = new Set();
    saveSelection();

    populateSubjectsUI();
    safeSet(LAST_SYNC_KEY, Date.now().toString());
    safeRemove(SESSION_KEY);

    showSyncStatus(`${questionBank.__subjects__.length} chapters sync হয়েছে!`, true);

  } catch(err){
    console.warn("Sync failed:", err);
    showSyncStatus("Sync failed: " + err.message, false);
  }
}

function autoLoadSheetIfNeeded(){
  const lastSync = parseInt(safeGet(LAST_SYNC_KEY) || "0");

  if(SHEET_TSV_URL && (Date.now() - lastSync > 30 * 60 * 1000 || !safeGet(BANK_KEY))){
    syncFromSheet(SHEET_TSV_URL);
  } else {
    populateSubjectsUI();
  }
}
window.autoLoadSheetIfNeeded = autoLoadSheetIfNeeded;

async function fetchAIExplanation(questionObj, rowIndex, quizType){
  if(!questionObj || !questionObj.q) return null;
  if(questionObj.note && questionObj.note.trim().length > 10 && !questionObj._aiGenerated) return null;
  if(questionObj._aiFetched) return null;

  questionObj._aiFetched = true;

  try{
    const response = await fetch('/api/quiz-ai', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        question: questionObj.q,
        options: questionObj.o ? questionObj.o.join(' | ') : '',
        correctAnswer: questionObj.o && questionObj.a !== undefined ? questionObj.o[questionObj.a] : '',
        subject: questionObj._groupName || '',
        chapter: questionObj._chapterName || ''
      })
    });

    if(!response.ok) return null;

    const data = await response.json();
    if(data.error) return null;

    let explanation = data.explanation || '';

    explanation = explanation
      .replace(/<think>[\s\S]*?<\/think>/gi, '')
      .replace(/<think>[\s\S]*/gi, '')
      .replace(/```[\s\S]*?```/g, '')
      .replace(/`/g, '')
      .replace(/\*\*/g, '')
      .replace(/\*/g, '')
      .replace(/#{1,6}\s/g, '')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .trim();

    if(explanation && rowIndex){
      try{
        await fetch('/api/update-sheet', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            rowIndex: rowIndex,
            explanation: explanation,
            quizType: quizType
          })
        });

        console.log('✅ Explanation শীটে সেভ হয়েছে, রো নম্বর:', rowIndex);
      } catch(sheetError){
        console.warn('⚠️ শীটে সেভ করতে সমস্যা হয়েছে:', sheetError);
      }
    }

    return explanation;

  } catch(e){
    console.warn('AI ব্যাখ্যা আনতে সমস্যা:', e);
    return null;
  }
}

async function checkAndFixQuestion(questionObj){
  if(!questionObj || !questionObj.q) return null;
  if(questionObj._aiChecked || questionObj._checkingNow) return null;

  questionObj._checkingNow = true;

  const sheetRowIndex = questionObj._sheetRowIndex || null;
  const quizType = CURRENT_CLASS;

  try{
    const response = await fetch('/api/questioncheck', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        question: questionObj.q,
        options: questionObj.o,
        correctAnswer: questionObj.a,
        subject: questionObj._groupName || '',
        chapter: questionObj._chapterName || '',
        rowIndex: sheetRowIndex,
        quizType: quizType,
        alreadyChecked: false
      })
    });

    questionObj._checkingNow = false;

    if(!response.ok) return null;

    const data = await response.json();

    questionObj._aiChecked = true;

    if(data.needsCorrection){
      if(data.correctedQuestion) questionObj.q = data.correctedQuestion;
      if(Array.isArray(data.correctedOptions) && data.correctedOptions.length === 4) questionObj.o = data.correctedOptions;
      if(data.correctAnswer !== undefined && data.correctAnswer !== null) questionObj.a = data.correctAnswer;

      if(data.aiExplanation && (!questionObj.note || questionObj.note.trim().length < 10)){
        questionObj.note = data.aiExplanation;
        questionObj._aiGenerated = true;
      }
    }

    if(questionObj._subject && questionObj._index !== undefined && questionBank[questionObj._subject] && questionBank[questionObj._subject][questionObj._index]){
      questionBank[questionObj._subject][questionObj._index]._aiChecked = true;

      if(data.needsCorrection){
        questionBank[questionObj._subject][questionObj._index].q = questionObj.q;
        questionBank[questionObj._subject][questionObj._index].o = questionObj.o;
        questionBank[questionObj._subject][questionObj._index].a = questionObj.a;

        if(questionObj.note){
          questionBank[questionObj._subject][questionObj._index].note = questionObj.note;
        }

        if(questionObj._aiGenerated){
          questionBank[questionObj._subject][questionObj._index]._aiGenerated = true;
        }
      }

      saveBank();
    }

    return data;

  } catch(e){
    questionObj._checkingNow = false;
    console.warn('Question check failed:', e);
    return null;
  }
}

function playFeedbackSound(pct){
  var sound = (pct===100) ? 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'
    : (pct>=90) ? 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'
    : (pct>=80) ? 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3'
    : (pct>=60) ? 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3'
    : (pct>=45) ? 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3'
    : 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3';

  if(!sound) return;

  try{
    var audio = new Audio(sound);
    audio.volume = 1.0;
    var p = audio.play();

    if(p && p.catch){
      p.catch(function(e){
        console.warn("Audio blocked:", e);
      });
    }
  } catch(e){
    console.warn("Audio error:", e);
  }
}

function fireConfetti(){
  const count = 500;
  const defaults = {spread:360,ticks:80,gravity:0.6,decay:0.9,startVelocity:30};

  for(let i=0;i<5;i++){
    confetti({...defaults, particleCount:count/5, origin:{x:Math.random(), y:Math.random()*0.5}});
  }
}

function showResultsOverlay(){
  const c = answerStatus.filter(Boolean).length;
  const w = userAnswers.filter((a,i)=>a !== null && a !== -1 && !answerStatus[i]).length;
  const s = totalQuestions - userAnswers.filter(a=>a !== null).length;
  const score = Math.max(0, c - w * 0.5);
  const pct = totalQuestions > 0 ? Math.round((score / totalQuestions) * 100) : 0;

  let emoji, message;

  if(pct === 100){
    emoji = '🏆';
    message = 'তুমি তো মাস্টার! একেবারে আগুন!';
  } else if(pct >= 90){
    emoji = '😱';
    message = 'অসাধারণ! নিখুঁতের ধারেকাছে!';
  } else if(pct >= 80){
    emoji = '🎉';
    message = 'দারুণ! অসাধারণ!';
  } else if(pct >= 60){
    emoji = '👏';
    message = 'সাবাশ, ভালোই এগোচ্ছো।';
  } else if(pct >= 45){
    emoji = '😒';
    message = 'আরেকটু প্র্যাকটিস চাই।';
  } else if(pct >= 35){
    emoji = '😐';
    message = 'লেগে থাকো, পরের বার ভালো হবে!';
  } else {
    emoji = '😢';
    message = 'লেগে থাকো, ঠিকই পারবে!';
  }

  playFeedbackSound(pct);

  document.getElementById('resultsEmoji').textContent = emoji;
  document.getElementById('resultsMessage').textContent = message;
  document.getElementById('resultsScore').textContent = score + '/' + totalQuestions;

  const banner = document.getElementById('resultsBanner');

  if(banner){
    const ti = quizTimeLimit ? ' • ' + quizTimeLimit + ' min' : '';

    if(quizGeneratedBy === 'random') banner.textContent = '🎲 Random Test' + ti;
    else if(quizGeneratedBy === 'seq') banner.textContent = '✅ Sequential Test' + ti;
    else banner.textContent = '';
  }

  document.getElementById('resCorrect').textContent = c;
  document.getElementById('resWrong').textContent = w;
  document.getElementById('resSkipped').textContent = s;
  document.getElementById('percentageFill').style.width = pct + '%';
  document.getElementById('percentageText').textContent = pct + '%';

  const chDiv = document.getElementById('resultsChapters');

  if(chDiv && currentQuestions.length){
    const cm = new Map();

    for(const q of currentQuestions){
      const gn = q._groupName || 'Unknown';
      const cn = q._chapterName || 'Unknown';

      if(!cm.has(gn)) cm.set(gn, new Map());

      const cc = cm.get(gn);
      cc.set(cn, (cc.get(cn) || 0) + 1);
    }

    let html = '<strong>📚 Subjects & Chapters:</strong><br>';

    for(const [group, chapters] of cm){
      html += '• <strong>' + escapeHtml(group) + ':</strong> ';
      html += [...chapters].map(([ch,count]) => escapeHtml(ch) + ' (' + count + ' Qs)').join(', ');
      html += '<br>';
    }

    chDiv.innerHTML = html;
  } else if(chDiv){
    chDiv.innerHTML = '';
  }

  document.getElementById('resultsOverlay').classList.remove('hidden');
}

function hideResultsOverlay(){
  document.getElementById('resultsOverlay').classList.add('hidden');
}

function toggleOptionsVisibility(){
  optionsHidden = !optionsHidden;

  const oc = document.getElementById('optionsContainer');
  const hb = document.getElementById('hideOptionsBtn');

  if(oc){
    if(optionsHidden){
      oc.classList.add('hidden-options');

      if(hb){
        hb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        hb.title = 'Options দেখাও';
      }
    } else {
      oc.classList.remove('hidden-options');

      if(hb){
        hb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
        hb.title = 'Options লুকান';

window.toggleOptionsVisibility = toggleOptionsVisibility;

function renderQuiz(){
  if(!currentQuestions.length){
    $("questionsArea").innerHTML = "<div class='question-card' style='text-align:center;padding:50px'>⬆️ Select subjects and click Generate</div>";
    return;
  }

  currentIndex = Math.max(0, Math.min(currentIndex, currentQuestions.length - 1));

  const q = currentQuestions[currentIndex];
  const sheetRowIndex = q._sheetRowIndex || null;
  const quizType = CURRENT_CLASS;

  if(!q._aiChecked && quizMode !== 'mock'){
    setTimeout(async()=>{
      const correction = await checkAndFixQuestion(q);

      if(correction && currentQuestions[currentIndex] === q){
        renderQuiz();
      }
    }, 100);
  }

  if(!q.note && !q._aiFetched && quizMode !== 'mock'){
    setTimeout(async()=>{
      const explanation = await fetchAIExplanation(q, sheetRowIndex, quizType);

      if(explanation){
        q.note = explanation;
        q._aiGenerated = true;

        if(q._subject && q._index !== undefined && questionBank[q._subject]){
          questionBank[q._subject][q._index].note = explanation;
          questionBank[q._subject][q._index]._aiGenerated = true;
          saveBank();
        }

        if(currentQuestions[currentIndex] === q){
          renderQuiz();
        }
      }
    }, 200);
  }

  const answered = userAnswers[currentIndex] !== null;
  const showResult = quizSubmitted || (quizMode === "practice" && answered);
  const noteVisible = quizSubmitted || (quizMode === "practice" && answered) || (quizMode !== "mock" && $("showNoteBeforeAnswer").checked);

  const diffClass = 'pill difficulty-' + (q.difficulty || 'medium');
  const diffLabel = {easy:'🟢 Easy',medium:'🟠 Medium',hard:'🔴 Hard'}[q.difficulty || 'medium'] || 'Medium';

  const optHtml = q.o.map((opt,i)=>{
    let cls = "option";

    if(showResult && i === q.a) cls += " correct-answer";
    if(showResult && userAnswers[currentIndex] === i && userAnswers[currentIndex] !== -1 && !answerStatus[currentIndex]) cls += " wrong-feedback";
    if(quizMode === "mock" && !quizSubmitted && userAnswers[currentIndex] === i && answered) cls += " selected-mock";

    return `<div class="${cls}" data-opt="${i}"><span class="key">${i+1}</span><span>${String.fromCharCode(65+i)}. ${safeHtml(opt)}</span></div>`;
  }).join("");

  const hideBtnIcon = optionsHidden
    ? '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

  const hideBtnTitle = optionsHidden ? 'Options দেখাও' : 'Options লুকান';
  const optionsHiddenClass = optionsHidden ? 'hidden-options' : '';

  $("questionsArea").innerHTML = `
  <div class="question-card" id="questionCardEl" style="position:relative">
    <button class="hide-options-btn" id="hideOptionsBtn" title="${hideBtnTitle}" onclick="toggleOptionsVisibility()">${hideBtnIcon}</button>

    <div class="question-meta">
      <span class="pill">${currentIndex+1}/${totalQuestions}</span>
      <span class="pill">${escapeHtml(q._groupName || "")}</span>
      <span class="pill">${escapeHtml(q._chapterName || "")}</span>
      <span class="${diffClass}">${diffLabel}</span>
      ${quizMode === "mock" && timerActive ? `<span class="timer-display" id="timerPill">⏱️ <span id="timerPillText">--:--</span></span>` : ""}
    </div>

    <div class="question-text" style="padding-right:30px">${currentIndex+1}. ${safeHtml(q.q)}</div>

    <div class="options ${optionsHiddenClass}" id="optionsContainer">${optHtml}</div>

    <div class="info ${noteVisible ? "show" : ""} ${q._aiGenerated ? 'ai-generated' : ''}" id="noteBox">📖 ${safeHtml(q.note || "No explanation")}</div>

    <div class="nav-buttons-large">
      <button id="prevQ" ${currentIndex === 0 ? "disabled" : ""}>◀ Previous</button>
      <button id="nextQ" ${currentIndex === totalQuestions - 1 ? "disabled" : ""}>Next ▶</button>
    </div>
  </div>`;

  document.querySelectorAll(".option").forEach(el=>{
    el.onclick = ()=>{
      if(quizSubmitted) return;
      if(optionsHidden) return;

      if(quizMode === "mock"){
        if(userAnswers[currentIndex] !== null) return;
      } else {
        if(userAnswers[currentIndex] !== null) return;
      }

      const sel = Number(el.dataset.opt);
      userAnswers[currentIndex] = sel;
      answerStatus[currentIndex] = (sel === q.a);

      if(answerStatus[currentIndex] && quizMode !== "mock") fireConfetti();

      renderQuiz();
      renderNav();
      updateScore();
      saveQuizState();
    };
  });

  const prevBtn = document.getElementById('prevQ');
  const nextBtn = document.getElementById('nextQ');

  if(prevBtn) prevBtn.onclick = ()=>moveQuestion(-1);
  if(nextBtn) nextBtn.onclick = ()=>moveQuestion(1);

  updateTimerDisplay();
  renderLatex();
}

function moveQuestion(d){
  const n = currentIndex + d;
  if(n < 0 || n >= totalQuestions) return;

  currentIndex = n;

  renderQuiz();
  renderNav();
  saveQuizState();
}

function renderNav(){
  let g = "";
  const isMockActive = (quizMode === "mock" && !quizSubmitted);

  for(let i=0;i<totalQuestions;i++){
    let cls = "q-num";

    if(isMockActive){
      if(userAnswers[i] !== null && userAnswers[i] !== -1) cls += " attempted-mock";
    } else {
      if(userAnswers[i] !== null && userAnswers[i] !== -1) cls += answerStatus[i] ? " answered-correct" : " answered-wrong";
      else if(quizMode === "mock" && quizSubmitted && (userAnswers[i] === null || userAnswers[i] === -1)) cls += " skipped";
    }

    if(i === currentIndex) cls += " current";

    g += `<div class="${cls}" data-idx="${i}">${i+1}</div>`;
  }

  $("navGrid").innerHTML = g;

  document.querySelectorAll(".q-num").forEach(el=>{
    el.onclick = ()=>{
      currentIndex = Number(el.dataset.idx);
      renderQuiz();
      renderNav();
      saveQuizState();
    };
  });
}

function updateScore(){
  const c = answerStatus.filter(Boolean).length;
  const a = userAnswers.filter(v => v !== null && v !== -1).length;
  const w = a - c;
  const s = totalQuestions - a;

  if(quizMode === "mock" && !quizSubmitted){
    $("scoreBoard").innerHTML = `⏱️ Mock Test in Progress`;
  } else {
    if(quizMode === "mock" && quizSubmitted){
      const score = Math.max(0, c - w * 0.5);
      $("scoreBoard").innerHTML = `🎯 Score: ${score}/${totalQuestions}<br><span class="score-breakdown">✅${c} | ❌${w} (×-0.5) | ⏭️${s}</span>`;
    } else {
      $("scoreBoard").innerHTML = `🎯 Score: ${c}/${totalQuestions}<br><span class="score-breakdown">✅${c} | ❌${w} | ⏭️${s}</span>`;
    }
  }

  const noteRow = $("noteToggleRow");
  const showScoreBtn = $("showScoreBtn");

  if(quizMode === "mock" && !quizSubmitted){
    if(noteRow) noteRow.style.display = 'none';
    if(showScoreBtn) showScoreBtn.style.display = 'none';
  } else {
    if(noteRow) noteRow.style.display = '';
    if(showScoreBtn) showScoreBtn.style.display = '';
  }
}

function resetAnswers(){
  quizSubmitted = false;
  optionsVisible = true;
  optionsHidden = false;

  userAnswers.fill(null);
  answerStatus.fill(false);

  currentIndex = 0;

  stopTimer();

  timeRemaining = null;
  timerActive = false;
  quizGeneratedBy = null;
  quizTimeLimit = null;

  if(quizMode === "mock"){
    const tl = parseInt($("timeLimit").value) || 30;
    timeRemaining = tl * 60;
    startTimer(timeRemaining);
  }

  renderQuiz();
  renderNav();
  updateScore();
  updateTimerDisplay();
  saveQuizState();
}

function submitMockTest(){
  if(!confirm("Mock test submit করবেন?")) return;

  stopTimer();
  quizSubmitted = true;

  renderQuiz();
  renderNav();
  updateScore();
  saveQuizState();

  fireConfetti();
  showResultsOverlay();
}

function safeHtml(v){
  if(!v) return '';

  let s = String(v);

  const safeTags = [
    [/<u>/gi, '%%U_OPEN%%'], [/<\/u>/gi, '%%U_CLOSE%%'],
    [/<b>/gi, '%%B_OPEN%%'], [/<\/b>/gi, '%%B_CLOSE%%'],
    [/<i>/gi, '%%I_OPEN%%'], [/<\/i>/gi, '%%I_CLOSE%%'],
    [/<strong>/gi, '%%STRONG_OPEN%%'], [/<\/strong>/gi, '%%STRONG_CLOSE%%'],
    [/<em>/gi, '%%EM_OPEN%%'], [/<\/em>/gi, '%%EM_CLOSE%%'],
    [/<br\s*\/?>/gi, '%%BR%%']
  ];

  safeTags.forEach(([re, ph])=>{
    s = s.replace(re, ph);
  });

  s = s.replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[ch]));

  const restore = [
    [/%%U_OPEN%%/g, '<u>'], [/%%U_CLOSE%%/g, '</u>'],
    [/%%B_OPEN%%/g, '<b>'], [/%%B_CLOSE%%/g, '</b>'],
    [/%%I_OPEN%%/g, '<i>'], [/%%I_CLOSE%%/g, '</i>'],
    [/%%STRONG_OPEN%%/g, '<strong>'], [/%%STRONG_CLOSE%%/g, '</strong>'],
    [/%%EM_OPEN%%/g, '<em>'], [/%%EM_CLOSE%%/g, '</em>'],
    [/%%BR%%/g, '<br>']
  ];

  restore.forEach(([re, tag])=>{
    s = s.replace(re, tag);
  });

  return s;
}

function escapeHtml(v){
  return String(v).replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[ch]));
}

function escapeAttr(v){
  return escapeHtml(v).replace(/`/g, "&#096;");
}

let timerInterval = null;
let timeRemaining = null;
let timerActive = false;

function startTimer(seconds){
  stopTimer();

  timeRemaining = seconds;
  timerActive = true;

  updateTimerDisplay();

  timerInterval = setInterval(()=>{
    timeRemaining--;
    updateTimerDisplay();

    if(timeRemaining <= 0){
      stopTimer();

      if(quizMode === "mock"){
        quizSubmitted = true;

        renderQuiz();
        renderNav();
        updateScore();
        saveQuizState();

        fireConfetti();
        showResultsOverlay();
      }
    }
  }, 1000);
}

function stopTimer(){
  if(timerInterval) clearInterval(timerInterval);

  timerInterval = null;
  timerActive = false;

  updateTimerDisplay();
}

function updateTimerDisplay(){
  const td = $('timerDisplay');
  const tpt = document.getElementById('timerPillText');

  if(quizMode === "mock" && timeRemaining !== null){
    if(td) td.style.display = 'block';

    const mins = Math.floor(Math.max(0,timeRemaining) / 60);
    const secs = Math.floor(Math.max(0,timeRemaining) % 60);
    const display = `${mins}:${secs.toString().padStart(2,'0')}`;

    if(td){
      td.innerHTML = `⏱️ Time: <strong>${display}</strong>`;
      td.className = timeRemaining <= 60 ? 'timer-display danger' : (timeRemaining <= 180 ? 'timer-display warn' : 'timer-display');
    }

    if(tpt) tpt.textContent = display;

    const qCard = document.getElementById('questionCardEl');

    if(qCard){
      qCard.classList.remove('timer-warn','timer-danger');

      if(timeRemaining <= 60) qCard.classList.add('timer-danger');
      else if(timeRemaining <= 180) qCard.classList.add('timer-warn');
    }
  } else {
    if(td) td.style.display = 'none';
    if(tpt) tpt.textContent = '--:--';
  }

  if($("submitMockBtn")){
    $("submitMockBtn").style.display = (quizMode === "mock" && timerActive) ? 'block' : 'none';
  }
}

function updateModeButtons(){
  document.querySelectorAll('.mode-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.mode === quizMode);
  });
}

function setQuizMode(mode){
  quizMode = mode;

  updateModeButtons();
  stopTimer();

  timeRemaining = null;
  timerActive = false;
  quizSubmitted = false;
  optionsVisible = true;
  optionsHidden = false;

  updateTimerDisplay();

  if(currentQuestions.length > 0 && mode === "mock"){
    const tl = parseInt($("timeLimit").value) || 30;
    timeRemaining = tl * 60;
    startTimer(timeRemaining);
  }

  saveQuizState();
}

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);

  const btn = $('themeToggleBtn');

  if(btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';

  applyTheme(next);
  localStorage.setItem(THEME_KEY, next);
}

function wireEvents(){
  $("chapterToggleBtn").onclick = ()=> $("chapterPanel").classList.toggle("open");

  $("selectAllBtn").onclick = ()=>{
    selectedKeys = new Set(getSubjects().map(s => s.key));
    populateSubjectsUI();
    saveSelection();
  };

  $("deselectAllBtn").onclick = ()=>{
    selectedKeys.clear();
    populateSubjectsUI();
    saveSelection();
  };

  $("generateBtn").onclick = ()=> generateQuiz(getSelectedKeys(), Number($("quizSize").value), false);
  $("randomBtn").onclick = ()=> generateQuiz(getSelectedKeys(), Number($("quizSize").value), true);
  $("syncHeaderBtn").onclick = ()=> syncFromSheet(SHEET_TSV_URL);
  $("resetHeaderBtn").onclick = resetAnswers;

  $("showScoreBtn").onclick = ()=>{
    const c = answerStatus.filter(Boolean).length;
    const w = userAnswers.filter((a,i)=>a !== null && a !== -1 && !answerStatus[i]).length;
    const s = totalQuestions - userAnswers.filter(a => a !== null && a !== -1).length;
    const score = Math.max(0, c - w * 0.5);
    const pct = totalQuestions > 0 ? Math.round((score / totalQuestions) * 100) : 0;

    alert(`📊 Results Summary\n✅ Correct: ${c}\n❌ Wrong: ${w}\n⏭️ Skipped: ${s}\n📈 Score: ${score}/${totalQuestions}\n📈 Accuracy: ${pct}%`);
  };

  $("showNoteBeforeAnswer").onchange = renderQuiz;
  $("submitMockBtn").onclick = submitMockTest;

  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> setQuizMode(btn.dataset.mode));
  });

  $("themeToggleBtn").onclick = toggleTheme;
  $("closeResultsBtn").onclick = hideResultsOverlay;

  document.addEventListener("keydown", e=>{
    const t = document.activeElement?.tagName?.toLowerCase();

    if(["input","textarea","select"].includes(t)) return;

    if(["1","2","3","4"].includes(e.key) && !optionsHidden){
      const o = document.querySelector(`.option[data-opt="${Number(e.key)-1}"]`);
      if(o) o.click();
    }

    if(e.key === "ArrowRight") moveQuestion(1);
    if(e.key === "ArrowLeft") moveQuestion(-1);
  });
}

function renderLatex(){
  if(typeof renderMathInElement === 'function'){
    const el = document.getElementById('questionsArea');

    if(el){
      renderMathInElement(el, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });
    }
  } else {
    setTimeout(renderLatex, 300);
  }
}

function initCredits(){
  $("creditName").textContent = "✨ By Arif Hussain";
}

function init(){
  const savedTheme = localStorage.getItem(THEME_KEY) || 'light';

  applyTheme(savedTheme);
  loadAccordionState();
  initCredits();

  populateSubjectsUI();
  updateModeButtons();
  wireEvents();

  if(!loadQuizState()){
    renderQuiz();
    renderNav();
    updateScore();
  }

  updateTimerDisplay();
}

let questionBank = normalizeBank(loadJson(BANK_KEY, null) || buildDefaultBank());
let selectedKeys = new Set(loadJson(SELECTED_KEY, []));
let currentQuestions = [];
let userAnswers = [];
let answerStatus = [];
let currentIndex = 0;
let totalQuestions = 0;
let quizMode = "practice";
let quizSubmitted = false;
let optionsVisible = true;
let optionsHidden = false;
let quizGeneratedBy = null;
let quizTimeLimit = null;

(function(){
  const overlay = document.getElementById('warningOverlay');
  const pwdInput = document.getElementById('passwordInput');
  const submitBtn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');
  const card = document.getElementById('authCard');
  const app = document.getElementById('app');

  if(card){
    document.addEventListener('mousemove', e=>{
      const xAxis = (window.innerWidth/2 - e.clientX) / 25;
      const yAxis = (window.innerHeight/2 - e.clientY) / 25;

      card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    document.addEventListener('mouseleave', ()=>{
      card.style.transform = 'rotateY(0deg) rotateX(0deg)';
    });
  }

  function unlock(){
    errorMsg.textContent = '';

    pwdInput.style.borderColor = '#00cc44';
    pwdInput.style.boxShadow = '0 0 30px rgba(0,255,80,0.7)';

    submitBtn.style.background = '#1a0a0a';
    submitBtn.style.borderColor = '#00cc44';
    submitBtn.style.color = '#4ade80';
    submitBtn.textContent = '✓ GRANTED';

    setTimeout(()=>{
      overlay.classList.add('hidden');
      app.style.display = 'block';

      if(typeof autoLoadSheetIfNeeded === 'function') autoLoadSheetIfNeeded();
    }, 400);
  }

  function attempt(pswd){
    if(pswd === CORRECT_PASSWORD){
      unlock();
    } else {
      errorMsg.textContent = '⛔ INCORRECT AUTHORIZATION CODE';

      pwdInput.classList.add('shake');
      pwdInput.style.borderColor = '#c41e1e';
      pwdInput.value = '';

      setTimeout(()=>{
        pwdInput.classList.remove('shake');
        pwdInput.focus();
      }, 500);
    }
  }

  submitBtn.addEventListener('click', ()=>{
    const val = pwdInput.value.trim();

    if(!val){
      errorMsg.textContent = 'Please enter the code.';
      return;
    }

    attempt(val);
  });

  pwdInput.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){
      e.preventDefault();
      submitBtn.click();
    }
  });

  pwdInput.focus();
})();

init();
</script>
