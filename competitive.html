<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMPETITIVE EXAMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000010;
            --portal-ssc: #FFB74D;
            --portal-ssc-glow: #ff9800;
            --portal-defence: #EF5350;
            --portal-defence-glow: #f44336;
            --portal-wbexam: #4DD0E1;
            --portal-wbexam-glow: #00bcd4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        canvas#galaxyCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto;
        }

        /* Overlay container */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Main title */
        .main-title {
            position: absolute;
            top: clamp(20px, 5vh, 50px);
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 20;
        }
        .main-title .title-bengali {
            font-family: 'Hind Siliguri', sans-serif;
            font-size: clamp(1.8rem, 3.5vw, 3.2rem);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 40px rgba(180, 200, 255, 0.8), 0 0 80px rgba(140, 160, 255, 0.5), 0 0 120px rgba(100, 140, 255, 0.4);
            letter-spacing: 0.04em;
            line-height: 1.3;
        }
        .main-title .title-sub {
            font-family: 'Orbitron', 'Hind Siliguri', sans-serif;
            font-size: clamp(0.7rem, 1.2vw, 0.95rem);
            font-weight: 400;
            color: rgba(200, 210, 240, 0.85);
            text-shadow: 0 0 20px rgba(150, 180, 240, 0.6);
            letter-spacing: 0.15em;
            margin-top: 4px;
        }

        /* Portal labels */
        .portal-label {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transform: translate(-50%, -50%);
            text-align: center;
            transition: filter 0.3s ease, transform 0.15s ease;
            z-index: 15;
            will-change: left, top;
        }
        .portal-label .label-inner {
            background: rgba(10, 12, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: clamp(8px, 1.5vh, 14px) clamp(14px, 2.5vw, 26px);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            white-space: nowrap;
        }
        .portal-label:hover .label-inner {
            transform: scale(1.12);
            box-shadow: 0 12px 44px rgba(0, 0, 0, 0.7);
        }
        .portal-label .label-name {
            font-family: 'Hind Siliguri', sans-serif;
            font-size: clamp(1rem, 1.8vw, 1.5rem);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.03em;
            text-shadow: 0 0 18px currentColor;
        }
        .portal-label .label-file {
            font-family: 'Orbitron', monospace;
            font-size: clamp(0.55rem, 0.9vw, 0.75rem);
            font-weight: 500;
            letter-spacing: 0.08em;
            opacity: 0.8;
            margin-top: 2px;
        }
        /* Portal-specific label accents */
        .portal-label.label-ssc .label-inner {
            border-color: rgba(255, 183, 77, 0.5);
            box-shadow: 0 8px 32px rgba(255, 152, 0, 0.25), 0 0 60px rgba(255, 152, 0, 0.1);
        }
        .portal-label.label-ssc .label-name {
            color: #FFB74D;
            text-shadow: 0 0 22px rgba(255, 152, 0, 0.8);
        }
        .portal-label.label-ssc:hover .label-inner {
            border-color: rgba(255, 183, 77, 0.9);
            box-shadow: 0 12px 44px rgba(255, 152, 0, 0.5), 0 0 90px rgba(255, 152, 0, 0.3);
        }

        .portal-label.label-defence .label-inner {
            border-color: rgba(239, 83, 80, 0.5);
            box-shadow: 0 8px 32px rgba(244, 67, 54, 0.25), 0 0 60px rgba(244, 67, 54, 0.1);
        }
        .portal-label.label-defence .label-name {
            color: #EF5350;
            text-shadow: 0 0 22px rgba(244, 67, 54, 0.8);
        }
        .portal-label.label-defence:hover .label-inner {
            border-color: rgba(239, 83, 80, 0.9);
            box-shadow: 0 12px 44px rgba(244, 67, 54, 0.5), 0 0 90px rgba(244, 67, 54, 0.3);
        }

        .portal-label.label-wbexam .label-inner {
            border-color: rgba(77, 208, 225, 0.5);
            box-shadow: 0 8px 32px rgba(0, 188, 212, 0.25), 0 0 60px rgba(0, 188, 212, 0.1);
        }
        .portal-label.label-wbexam .label-name {
            color: #4DD0E1;
            text-shadow: 0 0 22px rgba(0, 188, 212, 0.8);
        }
        .portal-label.label-wbexam:hover .label-inner {
            border-color: rgba(77, 208, 225, 0.9);
            box-shadow: 0 12px 44px rgba(0, 188, 212, 0.5), 0 0 90px rgba(0, 188, 212, 0.3);
        }

        /* Subtle hint at bottom */
        .hint-text {
            position: absolute;
            bottom: clamp(16px, 3vh, 30px);
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Hind Siliguri', sans-serif;
            font-size: clamp(0.7rem, 1vw, 0.85rem);
            color: rgba(180, 190, 220, 0.7);
            text-shadow: 0 0 10px rgba(150, 170, 220, 0.4);
            letter-spacing: 0.05em;
            pointer-events: none;
            text-align: center;
            animation: hintPulse 3s ease-in-out infinite;
        }
        @keyframes hintPulse {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 0.9;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .portal-label .label-inner {
                border-radius: 12px;
                padding: 8px 16px;
            }
            .portal-label .label-name {
                font-size: 0.9rem;
            }
            .portal-label .label-file {
                font-size: 0.6rem;
            }
            .main-title .title-bengali {
                font-size: 1.4rem;
            }
            .main-title .title-sub {
                font-size: 0.65rem;
            }
        }
        @media (max-width: 480px) {
            .portal-label .label-inner {
                border-radius: 10px;
                padding: 6px 12px;
            }
            .portal-label .label-name {
                font-size: 0.78rem;
            }
            .portal-label .label-file {
                font-size: 0.55rem;
            }
        }
    </style>
</head>
<body>

    <!-- Three.js Canvas -->
    <canvas id="galaxyCanvas"></canvas>

    <!-- Overlay -->
    <div class="overlay" id="overlay">
        <!-- Main Title -->
        <div class="main-title">
            <div class="title-bengali">✨ COMPETITIVE EXAMS ✨</div>
            <div class="title-sub">BY Arif Hussain</div>
        </div>

        <!-- Portal Labels (positioned by JS) -->
        <div class="portal-label label-ssc" id="labelSSC" data-url="ssc.html">
            <div class="label-inner">
                <div class="label-name">🎓 SSC</div>
                <div class="label-file"></div>

        </div>
        <div class="portal-label label-defence" id="labelDefence" data-url="defence.html">
            <div class="label-inner">
                <div class="label-name">🛡️ প্রতিরক্ষা</div>
                <div class="label-file"></div>
            </div>
        </div>
        <div class="portal-label label-wbexam" id="labelWBExam" data-url="wbpsc.html">
            <div class="label-inner">
                <div class="label-name">📝WBPSC পরীক্ষা</div>
                <div class="label-file"></div>
            </div>
        </div>

        <!-- Hint -->
        <div class="hint-text">📧 arifbeldanga@gmail.com &nbsp;|&nbsp; 💬 Telegram: @beldanga1 &nbsp;|&nbsp; If you want to support, UPI: arho065-1@okicici or 9564385573</div>
    </div>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ─────────────────────────────────────
        // DOM REFERENCES
        // ─────────────────────────────────────
        const canvas = document.getElementById('galaxyCanvas');
        const overlay = document.getElementById('overlay');
        const labelSSC = document.getElementById('labelSSC');
        const labelDefence = document.getElementById('labelDefence');
        const labelWBExam = document.getElementById('labelWBExam');
        const allLabels = [labelSSC, labelDefence, labelWBExam];

        // ─────────────────────────────────────
        // THREE.JS SETUP
        // ─────────────────────────────────────
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.5, 120);
        camera.position.set(0, 6.5, 17);
        camera.lookAt(0, 0.8, 0);

        // ─────────────────────────────────────
        // LIGHTING
        // ─────────────────────────────────────
        const ambientLight = new THREE.AmbientLight(0x1a1a3a, 1.8);
        scene.add(ambientLight);
        const pointLight1 = new THREE.PointLight(0x8899cc, 25, 40, 1.5);
        pointLight1.position.set(5, 8, 10);
        scene.add(pointLight1);
        const pointLight2 = new THREE.PointLight(0xcc8866, 18, 35, 1.5);
        pointLight2.position.set(-6, -2, -5);
        scene.add(pointLight2);

        // ─────────────────────────────────────
        // TEXTURE GENERATORS
        // ─────────────────────────────────────
        function createGlowTexture(hexColor, size = 256) {
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const ctx = c.getContext('2d');
            const half = size / 2;
            const grad = ctx.createRadialGradient(half, half, half * 0.02, half, half, half);
            grad.addColorStop(0, hexColor);
            grad.addColorStop(0.08, hexColor);
            grad.addColorStop(0.35, hexColor + '99');
            grad.addColorStop(0.65, hexColor + '22');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(c);
        }

        function createStarSpriteTexture(size = 64) {
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const ctx = c.getContext('2d');
            const half = size / 2;
            const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.04, '#ffffff');
            grad.addColorStop(0.18, '#ffffee');
            grad.addColorStop(0.45, 'rgba(200,210,255,0.55)');
            grad.addColorStop(0.8, 'rgba(80,100,180,0.06)');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(c);
        }

        function createCoreGlowTexture(size = 512) {
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const ctx = c.getContext('2d');
            const half = size / 2;
            const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.03, '#fffff8');
            grad.addColorStop(0.1, '#fff8e0');
            grad.addColorStop(0.3, '#ffd4a0');
            grad.addColorStop(0.55, '#cc88cc44');
            grad.addColorStop(0.8, '#44228811');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(c);
        }

        // Pre-generate textures
        const starSpriteTex = createStarSpriteTexture();
        const coreGlowTex = createCoreGlowTexture();
        const glowTexSSC = createGlowTexture('#ffb74d', 256);
        const glowTexDefence = createGlowTexture('#ef5350', 256);
        const glowTexWBExam = createGlowTexture('#4dd0e1', 256);

        // ─────────────────────────────────────
        // GALAXY GROUP
        // ─────────────────────────────────────
        const galaxyGroup = new THREE.Group();
        galaxyGroup.rotation.x = -0.45; // Tilt for 3D perspective
        galaxyGroup.rotation.y = 0.25;
        scene.add(galaxyGroup);

        // --- Spiral Arms ---
        const numArms = 4;
        const particlesPerArm = 2200;
        const galaxyRadius = 13;
        const armTightness = 2.8; // How many radians of spiral

        const armParticlesTotal = numArms * particlesPerArm;
        const armPositions = new Float32Array(armParticlesTotal * 3);
        const armColors = new Float32Array(armParticlesTotal * 3);
        const armSizesArr = new Float32Array(armParticlesTotal);

        for (let arm = 0; arm < numArms; arm++) {
            const baseAngle = arm * (Math.PI * 2) / numArms;
            for (let i = 0; i < particlesPerArm; i++) {
                const idx = arm * particlesPerArm + i;
                const t = i / particlesPerArm;
                const r = t * galaxyRadius;
                const spiralAngle = baseAngle + t * armTightness * Math.PI;
                const spreadAngle = (0.15 + t * 1.1) * 0.9;
                const angle = spiralAngle + (Math.random() - 0.5) * spreadAngle * 2;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                const thickness = 0.35 + t * 0.9;
                const y = (Math.random() - 0.5) * thickness * (1.0 + t * 1.5);

                armPositions[idx * 3] = x;
                armPositions[idx * 3 + 1] = y;
                armPositions[idx * 3 + 2] = z;

                // Color: warm inner → cool outer
                const warmMix = Math.max(0, 1 - t * 1.3);
                const coolMix = Math.max(0, (t - 0.25) * 1.4);
                const r_col = 0.85 * warmMix + 0.35 * coolMix + 0.15 * Math.random();
                const g_col = 0.7 * warmMix + 0.4 * coolMix + 0.2 * (1 - Math.abs(t - 0.5) * 2) + 0.1 * Math.random();
                const b_col = 0.4 * warmMix + 0.85 * coolMix + 0.2 * Math.random();
                armColors[idx * 3] = Math.min(1, r_col);
                armColors[idx * 3 + 1] = Math.min(1, g_col);
                armColors[idx * 3 + 2] = Math.min(1, b_col);

                armSizesArr[idx] = (0.03 + Math.random() * 0.09) * (1 - t * 0.5);
            }
        }

        const armGeom = new THREE.BufferGeometry();
        armGeom.setAttribute('position', new THREE.BufferAttribute(armPositions, 3));
        armGeom.setAttribute('color', new THREE.BufferAttribute(armColors, 3));
        armGeom.setAttribute('size', new THREE.BufferAttribute(armSizesArr, 1));
        const armMat = new THREE.PointsMaterial({
            size: 0.12,
            map: starSpriteTex,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.85,
            sizeAttenuation: true,
        });
        const armPoints = new THREE.Points(armGeom, armMat);
        galaxyGroup.add(armPoints);

        // --- Central Bulge ---
        const bulgeCount = 1800;
        const bulgeRadius = 2.8;
        const bulgePositions = new Float32Array(bulgeCount * 3);
        const bulgeColors = new Float32Array(bulgeCount * 3);
        for (let i = 0; i < bulgeCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = Math.pow(Math.random(), 1.8) * bulgeRadius;
            const x = Math.sin(phi) * Math.cos(theta) * r;
            const y = Math.sin(phi) * Math.sin(theta) * r * 0.35;
            const z = Math.cos(phi) * r;
            bulgePositions[i * 3] = x;
            bulgePositions[i * 3 + 1] = y;
            bulgePositions[i * 3 + 2] = z;
            const brightness = 0.7 + 0.3 * (1 - r / bulgeRadius);
            bulgeColors[i * 3] = brightness;
            bulgeColors[i * 3 + 1] = brightness * 0.9;
            bulgeColors[i * 3 + 2] = brightness * 0.7;
        }
        const bulgeGeom = new THREE.BufferGeometry();
        bulgeGeom.setAttribute('position', new THREE.BufferAttribute(bulgePositions, 3));
        bulgeGeom.setAttribute('color', new THREE.BufferAttribute(bulgeColors, 3));
        const bulgeMat = new THREE.PointsMaterial({
            size: 0.16,
            map: starSpriteTex,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true,
        });
        const bulgePoints = new THREE.Points(bulgeGeom, bulgeMat);
        galaxyGroup.add(bulgePoints);

        // --- Core Glow Sprite ---
        const coreGlowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: coreGlowTex,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.75,
            color: new THREE.Color('#fffef0'),
        }));
        coreGlowSprite.scale.set(7, 7, 1);
        coreGlowSprite.position.set(0, 0, 0);
        galaxyGroup.add(coreGlowSprite);

        // --- Bright Core Cluster ---
        const coreClusterCount = 400;
        const coreClusterPositions = new Float32Array(coreClusterCount * 3);
        const coreClusterColors = new Float32Array(coreClusterCount * 3);
        for (let i = 0; i < coreClusterCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = Math.pow(Math.random(), 3) * 1.2;
            coreClusterPositions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            coreClusterPositions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r * 0.3;
            coreClusterPositions[i * 3 + 2] = Math.cos(phi) * r;
            coreClusterColors[i * 3] = 1;
            coreClusterColors[i * 3 + 1] = 0.95;
            coreClusterColors[i * 3 + 2] = 0.8;
        }
        const coreClusterGeom = new THREE.BufferGeometry();
        coreClusterGeom.setAttribute('position', new THREE.BufferAttribute(coreClusterPositions, 3));
        coreClusterGeom.setAttribute('color', new THREE.BufferAttribute(coreClusterColors, 3));
        const coreClusterMat = new THREE.PointsMaterial({
            size: 0.22,
            map: starSpriteTex,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.95,
            sizeAttenuation: true,
        });
        const coreClusterPoints = new THREE.Points(coreClusterGeom, coreClusterMat);
        galaxyGroup.add(coreClusterPoints);

        // --- Scattered Bright Stars in Arms ---
        const brightStarCount = 600;
        const brightStarPositions = new Float32Array(brightStarCount * 3);
        const brightStarColors = new Float32Array(brightStarCount * 3);
        for (let i = 0; i < brightStarCount; i++) {
            const arm = Math.floor(Math.random() * numArms);
            const baseAngle = arm * (Math.PI * 2) / numArms;
            const t = Math.random();
            const r = t * galaxyRadius;
            const spiralAngle = baseAngle + t * armTightness * Math.PI;
            const angle = spiralAngle + (Math.random() - 0.5) * 0.6;
            brightStarPositions[i * 3] = Math.cos(angle) * r;
            brightStarPositions[i * 3 + 1] = (Math.random() - 0.5) * 0.4;
            brightStarPositions[i * 3 + 2] = Math.sin(angle) * r;
            const isBlue = Math.random() < 0.35;
            brightStarColors[i * 3] = isBlue ? 0.55 + Math.random() * 0.3 : 0.8 + Math.random() * 0.2;
            brightStarColors[i * 3 + 1] = isBlue ? 0.65 + Math.random() * 0.25 : 0.75 + Math.random() * 0.2;
            brightStarColors[i * 3 + 2] = isBlue ? 0.9 + Math.random() * 0.1 : 0.5 + Math.random() * 0.4;
        }
        const brightStarGeom = new THREE.BufferGeometry();
        brightStarGeom.setAttribute('position', new THREE.BufferAttribute(brightStarPositions, 3));
        brightStarGeom.setAttribute('color', new THREE.BufferAttribute(brightStarColors, 3));
        const brightStarMat = new THREE.PointsMaterial({
            size: 0.28,
            map: starSpriteTex,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true,
        });
        const brightStarPoints = new THREE.Points(brightStarGeom, brightStarMat);
        galaxyGroup.add(brightStarPoints);

        // ─────────────────────────────────────
        // BACKGROUND STARS (large sphere)
        // ─────────────────────────────────────
        const bgStarCount = 2500;
        const bgStarPositions = new Float32Array(bgStarCount * 3);
        const bgStarColors = new Float32Array(bgStarCount * 3);
        const bgRadius = 45;
        for (let i = 0; i < bgStarCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 20 + Math.random() * (bgRadius - 20);
            bgStarPositions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
            bgStarPositions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
            bgStarPositions[i * 3 + 2] = Math.cos(phi) * r;
            const brightness = 0.4 + Math.random() * 0.6;
            const tint = Math.random();
            bgStarColors[i * 3] = brightness * (0.7 + tint * 0.3);
            bgStarColors[i * 3 + 1] = brightness * (0.7 + tint * 0.3);
            bgStarColors[i * 3 + 2] = brightness * (0.8 + tint * 0.2);
        }
        const bgStarGeom = new THREE.BufferGeometry();
        bgStarGeom.setAttribute('position', new THREE.BufferAttribute(bgStarPositions, 3));
        bgStarGeom.setAttribute('color', new THREE.BufferAttribute(bgStarColors, 3));
        const bgStarMat = new THREE.PointsMaterial({
            size: 0.08,
            map: starSpriteTex,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.7,
            sizeAttenuation: true,
        });
        const bgStars = new THREE.Points(bgStarGeom, bgStarMat);
        scene.add(bgStars);

        // ─────────────────────────────────────
        // PORTAL CREATION FUNCTION
        // ─────────────────────────────────────
        function createPortal(glowTex, mainColorHex, innerColorHex, ringColorHex) {
            const portalGroup = new THREE.Group();

            // Glow sprite (large, behind)
            const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: glowTex,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.7,
                color: new THREE.Color(mainColorHex),
            }));
            glowSprite.scale.set(6.5, 6.5, 1);
            portalGroup.add(glowSprite);

            // Outer ring (torus)
            const ringGeom = new THREE.TorusGeometry(1.5, 0.12, 32, 80);
            const ringMat = new THREE.MeshStandardMaterial({
                color: new THREE.Color(ringColorHex),
                emissive: new THREE.Color(mainColorHex),
                emissiveIntensity: 1.8,
                roughness: 0.25,
                metalness: 0.7,
            });
            const ring = new THREE.Mesh(ringGeom, ringMat);
            ring.rotation.x = Math.PI * 0.45;
            ring.rotation.y = Math.random() * Math.PI * 2;
            portalGroup.add(ring);

            // Second thinner ring
            const ring2Geom = new THREE.TorusGeometry(1.65, 0.04, 24, 60);
            const ring2Mat = new THREE.MeshStandardMaterial({
                color: new THREE.Color(mainColorHex),
                emissive: new THREE.Color(mainColorHex),
                emissiveIntensity: 2.5,
                roughness: 0.2,
                metalness: 0.3,
            });
            const ring2 = new THREE.Mesh(ring2Geom, ring2Mat);
            ring2.rotation.x = Math.PI * 0.6;
            ring2.rotation.y = Math.random() * Math.PI * 2;
            portalGroup.add(ring2);

            // Main sphere (clickable)
            const sphereGeom = new THREE.SphereGeometry(1.15, 48, 48);
            const sphereMat = new THREE.MeshStandardMaterial({
                color: new THREE.Color(innerColorHex),
                emissive: new THREE.Color(mainColorHex),
                emissiveIntensity: 2.2,
                roughness: 0.18,
                metalness: 0.15,
            });
            const sphere = new THREE.Mesh(sphereGeom, sphereMat);
            sphere.name = 'portalSphere';
            portalGroup.add(sphere);

            // Inner bright core
            const innerCoreGeom = new THREE.SphereGeometry(0.5, 32, 32);
            const innerCoreMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color('#ffffff'),
                transparent: true,
                opacity: 0.85,
            });
            const innerCore = new THREE.Mesh(innerCoreGeom, innerCoreMat);
            portalGroup.add(innerCore);

            // Tiny orbiting particles ring
            const orbitParticleCount = 80;
            const orbitParticlePositions = new Float32Array(orbitParticleCount * 3);
            const orbitParticleColorsArr = new Float32Array(orbitParticleCount * 3);
            for (let i = 0; i < orbitParticleCount; i++) {
                const angle = (i / orbitParticleCount) * Math.PI * 2;
                const rad = 1.9 + (Math.random() - 0.5) * 0.35;
                orbitParticlePositions[i * 3] = Math.cos(angle) * rad;
                orbitParticlePositions[i * 3 + 1] = (Math.random() - 0.5) * 0.25;
                orbitParticlePositions[i * 3 + 2] = Math.sin(angle) * rad;
                orbitParticleColorsArr[i * 3] = 1;
                orbitParticleColorsArr[i * 3 + 1] = 0.85;
                orbitParticleColorsArr[i * 3 + 2] = 0.6;
            }
            const orbitParticleGeom = new THREE.BufferGeometry();
            orbitParticleGeom.setAttribute('position', new THREE.BufferAttribute(orbitParticlePositions, 3));
            orbitParticleGeom.setAttribute('color', new THREE.BufferAttribute(orbitParticleColorsArr, 3));
            const orbitParticleMat = new THREE.PointsMaterial({
                size: 0.06,
                map: starSpriteTex,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.75,
                sizeAttenuation: true,
            });
            const orbitParticles = new THREE.Points(orbitParticleGeom, orbitParticleMat);
            portalGroup.add(orbitParticles);
            portalGroup.userData = { orbitParticles, ring, ring2, glowSprite };

            return portalGroup;
        }

        // ─────────────────────────────────────
        // CREATE THREE PORTALS
        // ─────────────────────────────────────
        const portalSSC = createPortal(glowTexSSC, '#ffb74d', '#ffe0b2', '#ff9800');
        const portalDefence = createPortal(glowTexDefence, '#ef5350', '#ffcdd2', '#f44336');
        const portalWBExam = createPortal(glowTexWBExam, '#4dd0e1', '#b2ebf2', '#00bcd4');

        // Orbit pivots
        const orbitPivotSSC = new THREE.Group();
        const orbitPivotDefence = new THREE.Group();
        const orbitPivotWBExam = new THREE.Group();

        orbitPivotSSC.add(portalSSC);
        orbitPivotDefence.add(portalDefence);
        orbitPivotWBExam.add(portalWBExam);

        // Position portals within their pivots
        portalSSC.position.set(7.5, 4.2, 0);
        portalDefence.position.set(8.2, 2.8, 0);
        portalWBExam.position.set(7.8, 5.0, 0);

        // Set initial pivot rotations (spread them out)
        orbitPivotSSC.rotation.y = 0;
        orbitPivotDefence.rotation.y = Math.PI * 2 / 3;
        orbitPivotWBExam.rotation.y = Math.PI * 4 / 3;

        scene.add(orbitPivotSSC);
        scene.add(orbitPivotDefence);
        scene.add(orbitPivotWBExam);

        // Store references for animation & raycasting
        const portalData = [
            { pivot: orbitPivotSSC, group: portalSSC, label: labelSSC, url: 'ssc.html', baseY: 4.2, bobOffset: 0 },
            { pivot: orbitPivotDefence, group: portalDefence, label: labelDefence, url: 'defence.html', baseY: 2.8,
                bobOffset: Math.PI * 0.7 },
            { pivot: orbitPivotWBExam, group: portalWBExam, label: labelWBExam, url: 'wbpsc.html', baseY: 5.0,
                bobOffset: Math.PI * 1.4 },
        ];

        // Collect all clickable meshes (spheres + rings)
        const clickableObjects = [];
        portalData.forEach(pd => {
            pd.group.traverse(child => {
                if (child.isMesh && (child.geometry.type === 'SphereGeometry' || child.geometry.type ===
                        'TorusGeometry')) {
                    child.userData.portalData = pd;
                    clickableObjects.push(child);
                }
            });
        });

        // ─────────────────────────────────────
        // RAYCASTER
        // ─────────────────────────────────────
        const raycaster = new THREE.Raycaster();
        raycaster.params.Points.threshold = 1.5;
        raycaster.params.Line = { threshold: 0.5 };
        const mouse = new THREE.Vector2();
        let hoveredPortal = null;

        function getIntersections(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            return raycaster.intersectObjects(clickableObjects, false);
        }

        function updateCursor(event) {
            const intersects = getIntersections(event);
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (obj.userData.portalData) {
                    canvas.style.cursor = 'pointer';
                    if (hoveredPortal !== obj.userData.portalData) {
                        resetHoverScale();
                        hoveredPortal = obj.userData.portalData;
                        applyHoverScale(hoveredPortal, 1.18);
                    }
                    return;
                }
            }
            canvas.style.cursor = 'default';
            if (hoveredPortal) {
                resetHoverScale();
                hoveredPortal = null;
            }
        }

        function applyHoverScale(pd, scale) {
            pd.group.children.forEach(child => {
                if (child.isMesh && child.geometry.type === 'SphereGeometry') {
                    child.scale.setScalar(scale);
                }
            });
            if (pd.group.userData.glowSprite) {
                pd.group.userData.glowSprite.scale.set(7.5, 7.5, 1);
            }
        }

        function resetHoverScale() {
            if (!hoveredPortal) return;
            hoveredPortal.group.children.forEach(child => {
                if (child.isMesh && child.geometry.type === 'SphereGeometry') {
                    child.scale.setScalar(1);
                }
            });
            if (hoveredPortal.group.userData.glowSprite) {
                hoveredPortal.group.userData.glowSprite.scale.set(6.5, 6.5, 1);
            }
        }

        function handleClick(event) {
            const intersects = getIntersections(event);
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (obj.userData.portalData) {
                    const url = obj.userData.portalData.url;
                    // Navigate to the URL
                    window.location.href = url;
                }
            }
        }

        // Also handle clicks on the HTML labels
        allLabels.forEach(label => {
            label.addEventListener('click', (e) => {
                e.stopPropagation();
                const url = label.getAttribute('data-url');
                if (url) window.location.href = url;
            });
            label.addEventListener('mouseenter', () => {
                const url = label.getAttribute('data-url');
                const pd = portalData.find(p => p.url === url);
                if (pd && hoveredPortal !== pd) {
                    resetHoverScale();
                    hoveredPortal = pd;
                    applyHoverScale(pd, 1.18);
                    canvas.style.cursor = 'pointer';
                }
            });
            label.addEventListener('mouseleave', () => {
                resetHoverScale();
                hoveredPortal = null;
                canvas.style.cursor = 'default';
            });
        });

        canvas.addEventListener('mousemove', updateCursor, { passive: true });
        canvas.addEventListener('click', handleClick);
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                // Simulate mousemove + click
                const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY };
                updateCursor(fakeEvent);
                handleClick(fakeEvent);
            }
        }, { passive: true });

        // ─────────────────────────────────────
        // SCREEN PROJECTION HELPER
        // ─────────────────────────────────────
        const worldPos = new THREE.Vector3();
        const projectedPos = new THREE.Vector3();

        function getScreenPosition(worldPosition) {
            projectedPos.copy(worldPosition).project(camera);
            return {
                x: (projectedPos.x * 0.5 + 0.5) * window.innerWidth,
                y: (-projectedPos.y * 0.5 + 0.5) * window.innerHeight,
                behindCamera: projectedPos.z > 1,
            };
        }

        // ─────────────────────────────────────
        // ANIMATION LOOP
        // ─────────────────────────────────────
        const clock = new THREE.Clock();

        function animate(timestamp) {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);
            const elapsed = timestamp * 0.001;

            // Slow orbit of portals
            const orbitSpeed = 0.12; // radians per second
            orbitPivotSSC.rotation.y += orbitSpeed * dt;
            orbitPivotDefence.rotation.y += orbitSpeed * 0.85 * dt;
            orbitPivotWBExam.rotation.y += orbitSpeed * 0.92 * dt;

            // Gentle bob
            portalData.forEach(pd => {
                const bob = Math.sin(elapsed * 0.55 + pd.bobOffset) * 0.7;
                pd.group.position.y = pd.baseY + bob;
                // Rotate local rings
                if (pd.group.userData.ring) {
                    pd.group.userData.ring.rotation.z += 0.4 * dt;
                    pd.group.userData.ring.rotation.x += 0.25 * dt;
                }
                if (pd.group.userData.ring2) {
                    pd.group.userData.ring2.rotation.z -= 0.35 * dt;
                    pd.group.userData.ring2.rotation.x -= 0.3 * dt;
                }
                if (pd.group.userData.orbitParticles) {
                    pd.group.userData.orbitParticles.rotation.y += 0.9 * dt;
                }
                // Pulse glow
                if (pd.group.userData.glowSprite) {
                    const pulse = 1 + Math.sin(elapsed * 1.8 + pd.bobOffset) * 0.12;
                    const baseScale = (hoveredPortal === pd) ? 7.5 : 6.5;
                    pd.group.userData.glowSprite.scale.setScalar(baseScale * pulse);
                    pd.group.userData.glowSprite.material.opacity = (hoveredPortal === pd) ? 0.85 : 0.6 + Math.sin(
                        elapsed * 1.8 + pd.bobOffset) * 0.1;
                }
            });

            // Subtle galaxy rotation
            galaxyGroup.rotation.y += 0.025 * dt;
            // Subtle background star rotation
            bgStars.rotation.y += 0.008 * dt;
            bgStars.rotation.x += 0.004 * dt;

            // Core glow pulse
            const corePulse = 1 + Math.sin(elapsed * 0.7) * 0.06;
            coreGlowSprite.scale.set(7 * corePulse, 7 * corePulse, 1);
            coreGlowSprite.material.opacity = 0.7 + Math.sin(elapsed * 0.9) * 0.08;

            // Update label positions
            portalData.forEach(pd => {
                // Get world position of the portal's main sphere
                const sphereMesh = pd.group.children.find(c => c.isMesh && c.geometry.type === 'SphereGeometry' &&
                    c.geometry.parameters.radius > 0.8);
                const targetMesh = sphereMesh || pd.group.children.find(c => c.isMesh && c.geometry.type ===
                    'SphereGeometry');
                if (targetMesh) {
                    targetMesh.getWorldPosition(worldPos);
                    const screen = getScreenPosition(worldPos);
                    if (screen.behindCamera || screen.x < -100 || screen.x > window.innerWidth + 100 || screen.y < -100 ||
                        screen.y > window.innerHeight + 100) {
                        pd.label.style.opacity = '0';
                        pd.label.style.pointerEvents = 'none';
                    } else {
                        pd.label.style.opacity = '1';
                        pd.label.style.pointerEvents = 'auto';
                        pd.label.style.left = screen.x + 'px';
                        pd.label.style.top = (screen.y - 55) + 'px';
                    }
                }
            });

            // Render
            renderer.render(scene, camera);
        }

        // ─────────────────────────────────────
        // RESIZE HANDLER
        // ─────────────────────────────────────
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize, { passive: true });
        window.addEventListener('orientationchange', () => {
            setTimeout(onResize, 200);
        }, { passive: true });

        // ─────────────────────────────────────
        // INITIAL LABEL POSITIONING
        // ─────────────────────────────────────
        function initialLabelPosition() {
            portalData.forEach(pd => {
                const sphereMesh = pd.group.children.find(c => c.isMesh && c.geometry.type === 'SphereGeometry' &&
                    c.geometry.parameters.radius > 0.8);
                const targetMesh = sphereMesh || pd.group.children.find(c => c.isMesh && c.geometry.type ===
                    'SphereGeometry');
                if (targetMesh) {
                    targetMesh.getWorldPosition(worldPos);
                    const screen = getScreenPosition(worldPos);
                    pd.label.style.left = screen.x + 'px';
                    pd.label.style.top = (screen.y - 55) + 'px';
                    pd.label.style.opacity = '1';
                }
            });
        }

        // ─────────────────────────────────────
        // START
        // ─────────────────────────────────────
        initialLabelPosition();
        requestAnimationFrame(animate);

        // ─────────────────────────────────────
        // KEYBOARD SHORTCUTS (optional)
        // ─────────────────────────────────────
        window.addEventListener('keydown', (e) => {
            switch (e.key.toLowerCase()) {
                case '1':
                    window.location.href = 'ssc.html';
                    break;
                case '2':
                    window.location.href = 'defence.html';
                    break;
                case '3':
                    window.location.href = 'wbpsc.html';
                    break;
                default:
                    break;
            }
        });

        console.log('%c🚀 মহাজাগতিক জ্ঞানের দ্বার প্রস্তুত! %c| Cosmic Knowledge Portal Ready',
            'font-size:1.3em;color:#FFB74D;', 'color:#aaa;');
        console.log('%c🖱️ 3D পোর্টালে ক্লিক করুন অথবা লেবেলে ক্লিক করুন %c| Click 3D portals or labels',
            'color:#4DD0E1;', 'color:#aaa;');
        console.log('%c⌨️ কীবোর্ড শর্টকাট: 1=SSC, 2=Defence, 3=WBExam %c| Keyboard: 1,2,3',
            'color:#EF5350;', 'color:#aaa;');
    </script>
</body>
</html>
